id: https://w3id.org/synapse/governance/vocabularies
name: governance_vocabularies
title: Governance graph vocabularies
description: >-
  The graph layer's controlled vocabularies. An enum that `implements:
  [skos:Concept]` is a SKOS vocabulary, sagebrain-model's pattern: its enum_uri
  is a concept class (rdfs:subClassOf skos:Concept), scripts/build_graph_tbox.py
  adds a <enum_uri>Scheme ConceptScheme, and each value is a concept of that
  class with skos:prefLabel/skos:notation (the Synapse or source code, exactly)/
  skos:definition/skos:inScheme. A value shared by two enums is one concept in
  both schemes. An enum that `implements: [owl:Class]` lists external classes
  (DUO terms, WAC agent classes) used as values; it has no class of its own.
  The graph stores concept IRIs, never the code strings.
license: https://creativecommons.org/publicdomain/zero/1.0/
prefixes:
  gov: https://w3id.org/synapse/governance#
  linkml: https://w3id.org/linkml/
  skos: http://www.w3.org/2004/02/skos/core#
  owl: http://www.w3.org/2002/07/owl#
  acl: http://www.w3.org/ns/auth/acl#
  foaf: http://xmlns.com/foaf/0.1/
  DUO: http://purl.obolibrary.org/obo/DUO_
default_prefix: gov
imports:
  - linkml:types
enums:
  Permission:
    enum_uri: gov:Permission
    implements: [skos:Concept]
    description: >-
      A Synapse ACCESS_TYPE (org.sagebionetworks.repo.model.ACCESS_TYPE), as a
      Web Access Control access mode. Each value is also rdfs:subClassOf the WAC
      mode it amounts to (acl:Read, acl:Write, acl:Append, acl:Control), or of
      acl:Access when it has no WAC counterpart. The authorizer's derived ACCESS
      action isn't a value here; the authorizer_v1 projection derives it.
    permissible_values:
      CREATE:
        meaning: gov:Create
        description: Permission to create a new entity or resource.
        implements: [acl:Write]
      READ:
        meaning: gov:Read
        description: Permission to read or view the entity or resource.
        implements: [acl:Read]
      UPDATE:
        meaning: gov:Update
        description: Permission to modify or update the entity or resource.
        implements: [acl:Write]
      DELETE:
        meaning: gov:Delete
        description: Permission to delete the entity or resource.
        implements: [acl:Write]
      CHANGE_PERMISSIONS:
        meaning: gov:ChangePermissions
        description: Permission to change access permissions for the entity or resource.
        implements: [acl:Control]
      DOWNLOAD:
        meaning: gov:Download
        description: Permission to download files or data from the entity or resource.
        implements: [acl:Read]
      UPLOAD:
        meaning: gov:Upload
        description: Deprecated; adding this to an ACL has no effect.
        implements: [acl:Append]
      PARTICIPATE:
        meaning: gov:Participate
        description: Permission to participate in activities related to the entity, such as discussions or challenges.
        implements: [acl:Access]
      SUBMIT:
        meaning: gov:Submit
        description: Permission to submit content or data to the entity or resource.
        implements: [acl:Access]
      READ_PRIVATE_SUBMISSION:
        meaning: gov:ReadPrivateSubmission
        description: Permission to read private submissions associated with the entity.
        implements: [acl:Access]
      UPDATE_SUBMISSION:
        meaning: gov:UpdateSubmission
        description: Permission to update or modify a submission.
        implements: [acl:Access]
      DELETE_SUBMISSION:
        meaning: gov:DeleteSubmission
        description: Permission to delete a submission.
        implements: [acl:Access]
      TEAM_MEMBERSHIP_UPDATE:
        meaning: gov:TeamMembershipUpdate
        description: Permission to update team membership, such as adding or removing members.
        implements: [acl:Access]
      SEND_MESSAGE:
        meaning: gov:SendMessage
        description: Permission to send messages related to the entity or resource.
        implements: [acl:Access]
      CHANGE_SETTINGS:
        meaning: gov:ChangeSettings
        description: Permission to change settings or configuration for the entity or resource.
        implements: [acl:Access]
      MODERATE:
        meaning: gov:Moderate
        description: Permission to moderate content or activity related to the entity or resource.
        implements: [acl:Access]
      REVIEW_SUBMISSIONS:
        meaning: gov:ReviewSubmissions
        description: Enables reviewing submission groups (e.g., on Access Requirements) for specified objects.
        implements: [acl:Access]
      EXEMPTION_ELIGIBLE:
        meaning: gov:ExemptionEligible
        description: Qualifies for exemption when granted on Access Requirement ACLs.
        implements: [acl:Access]
  ApprovalStatus:
    enum_uri: gov:ApprovalStatus
    implements: [skos:Concept]
    description: >-
      An AccessApproval's state (org.sagebionetworks.repo.model.ApprovalState),
      verified against Synapse's OpenAPI spec.
    permissible_values:
      APPROVED:
        meaning: gov:Approved
        description: Approved. One concept in both the ApprovalStatus and SubmissionState schemes.
      REVOKED:
        meaning: gov:Revoked
        description: The approval was revoked.
  SubmissionState:
    enum_uri: gov:SubmissionState
    implements: [skos:Concept]
    description: >-
      A DataAccessSubmission's state (DataAccessSubmissionState), verified
      against SynapseWebClient's ACTDataAccessSubmissionWidget.
    permissible_values:
      SUBMITTED:
        meaning: gov:Submitted
        description: Submitted and awaiting review.
      APPROVED:
        meaning: gov:Approved
        description: Approved. One concept in both the ApprovalStatus and SubmissionState schemes.
      REJECTED:
        meaning: gov:Rejected
        description: Reviewed and rejected.
      CANCELLED:
        meaning: gov:Cancelled
        description: Cancelled by the submitter.
  AccessRequirementType:
    enum_uri: gov:AccessRequirementType
    implements: [skos:Concept]
    description: >-
      An Access Requirement's Synapse concreteType, by its short class name.
    permissible_values:
      TermsOfUseAccessRequirement:
        meaning: gov:TermsOfUseRequirement
        description: Restricted by terms of use (AccessRequirementType.TOU).
      SelfSignAccessRequirement:
        meaning: gov:SelfSignRequirement
        description: Restricted by terms of use, self-signed (AccessRequirementType.SELF_SIGNED).
      ACTAccessRequirement:
        meaning: gov:ACTRequirement
        description: Controlled by the Access and Compliance Team (AccessRequirementType.ATC).
      ManagedACTAccessRequirement:
        meaning: gov:ManagedACTRequirement
        description: >-
          Controlled by the Access and Compliance Team, with a managed data
          access submission workflow (AccessRequirementType.MANAGED_ATC). The
          only type with DataAccessSubmissions.
      LockAccessRequirement:
        meaning: gov:LockRequirement
        description: Controlled by the Access and Compliance Team; locks an entity (AccessRequirementType.LOCK).
  DataTier:
    enum_uri: gov:DataTier
    implements: [skos:Concept]
    description: >-
      How restricted data is, in increasing order. Each concept's gov:rank is
      its position: a derived output takes the highest rank among its inputs.
    permissible_values:
      Anonymous:
        meaning: gov:AnonymousTier
        rank: 0
        description: Data can be viewed and downloaded anonymously by anyone on the internet.
      Open:
        meaning: gov:OpenTier
        rank: 1
        description: Users must have a Synapse account to download data.
      Controlled:
        meaning: gov:ControlledTier
        rank: 2
        description: Users must have a Synapse account and satisfy access conditions to download data.
      Private:
        meaning: gov:PrivateTier
        rank: 3
        description: Users must be provided access to data in Synapse by a project administrator.
      Unclassified:
        meaning: gov:UnclassifiedTier
        rank: 4
        description: >-
          Tier not yet determined by a curator. Ranked above Private, so an
          entity bound to an Access Requirement with no recorded tier fails
          closed rather than reading as unrestricted.
  DerivationReviewStatus:
    enum_uri: gov:DerivationReviewStatus
    implements: [skos:Concept]
    description: Where a DerivationReview stands.
    permissible_values:
      Flagged:
        meaning: gov:DerivationFlagged
        description: >-
          Minted automatically because a derivation rule or disjoint
          sourceAccessRequirements need a person to look; not yet reviewed.
      Reviewed:
        meaning: gov:DerivationReviewed
        description: A person has looked at this combination but not yet recorded a decision.
      Approved:
        meaning: gov:DerivationApproved
        description: The combination was reviewed and judged safe to permit.
      Denied:
        meaning: gov:DerivationDenied
        description: The combination was reviewed and judged unsafe; access to the derived output should be blocked.
  AgentClass:
    implements: [owl:Class]
    description: >-
      Web Access Control agent classes, for Synapse's group principals that
      stand for everyone rather than for listed members.
    permissible_values:
      PUBLIC:
        meaning: foaf:Agent
        description: Anyone, signed in or not (Synapse's PUBLIC group, 273949).
      AUTHENTICATED_USERS:
        meaning: acl:AuthenticatedAgent
        description: Any signed-in Synapse user (Synapse's AUTHENTICATED_USERS group, 273948).
  DataUseTerm:
    implements: [owl:Class]
    description: >-
      A Data Use Ontology term, or a Sage-local extension of DUO's data use
      modifier (DUO:0000017). DUO:0000017 itself is not a value: a condition
      names a specific term.
    permissible_values:
      DUO:0000042:
        meaning: DUO:0000042
        description: General Research Use - This data use permission indicates that use is allowed for general research use for any research purpose.
      DUO:0000027:
        meaning: DUO:0000027
        description: Project Specific Restriction - This data use modifier indicates that use is limited to use within an approved project.
      DUO:0000016:
        meaning: DUO:0000016
        description: Genetic Studies Only - This data use modifier indicates that use is limited to genetic studies only (i.e., studies that include genotype research alone or both genotype and phenotype research, but not phenotype research exclusively)
      DUO:0000029:
        meaning: DUO:0000029
        description: Return to Database or Resource - This data use modifier indicates that the requestor must return derived/enriched data to the database/resource.
      DUO:0000043:
        meaning: DUO:0000043
        description: Clinical Care Use - This data use modifier indicates that use is allowed for clinical use and care.
      DUO:0000015:
        meaning: DUO:0000015
        description: No General Methods Research - This data use modifier indicates that use does not allow methods development research (e.g., development of software or algorithms).
      DUO:0000004:
        meaning: DUO:0000004
        description: No Restriction - This data use permission indicates there is no restriction on use.
      DUO:0000045:
        meaning: DUO:0000045
        description: Not-for-Profit Organisation Use Only - This data use modifier indicates that use of the data is limited to not-for-profit organizations.
      DUO:0000011:
        meaning: DUO:0000011
        description: Population Origins or Ancestry Research Only - This data use permission indicates that use of the data is limited to the study of population origins or ancestry.
      DUO:0000046:
        meaning: DUO:0000046
        description: Non-Commercial Use Only - This data use modifier indicates that use of the data is limited to not-for-profit use.
      DUO:0000018:
        meaning: DUO:0000018
        description: Not-for-Profit, Non-Commercial Use Only - This data use modifier indicates that use of the data is limited to not-for-profit organizations and not-for-profit use, non-commercial use.
      DUO:0000044:
        meaning: DUO:0000044
        description: Population Origins or Ancestry Research Prohibited - This data use modifier indicates use for purposes of population, origin, or ancestry research is prohibited.
      DUO:0000021:
        meaning: DUO:0000021
        description: Ethics Approval Required - This data use modifier indicates that the requestor must provide documentation of local IRB/ERB approval.
      DUO:0000006:
        meaning: DUO:0000006
        description: Health or Medical or Biomedical Research - This data use permission indicates that use is allowed for health/medical/biomedical purposes; does not include the study of population origins or ancestry.
      DUO:0000019:
        meaning: DUO:0000019
        description: Publication Required - This data use modifier indicates that requestor agrees to make results of studies using the data available to the larger scientific community.
      DUO:0000026:
        meaning: DUO:0000026
        description: User Specific Restriction - This data use modifier indicates that use is limited to use by approved users. If providing this term, please describe the restrictions in column userSpecificRestriction.
      DUO:0000020:
        meaning: DUO:0000020
        description: Collaboration Required - This data use modifier indicates that the requestor must agree to collaboration with the primary study investigator(s). If providing this term, please note the contact email in column collaborationRequired.
      DUO:0000012:
        meaning: DUO:0000012
        description: Research Specific Restrictions - This data use modifier indicates that use is limited to studies of a certain research type. If providing this term, please note the research type(s) in column researchSpecificRestrictions.
      DUO:0000025:
        meaning: DUO:0000025
        description: Time Limit on Use - This data use modifier indicates that use is approved for a specific number of months. If providing this term, please provide the number of months in column timeLimitOnUse.
      DUO:0000024:
        meaning: DUO:0000024
        description: Publication Moratorium - This data use modifier indicates that requestor agrees not to publish results of studies until a specific date. If providing this term, please provide the date in column publicationMoratorium.
      DUO:0000028:
        meaning: DUO:0000028
        description: Institution Specific Restriction - This data use modifier indicates that use is limited to use within an approved institution. If providing this term, please provide the institution ROR ID(s) in column institutionSpecificRestriction.
      DUO:0000022:
        meaning: DUO:0000022
        description: Geographical Restriction - This data use modifier indicates that use is limited to within a specific geographic region. If providing this term, please provide the applicable country code(s) in column geographicalRestriction.
      DUO:0000007:
        meaning: DUO:0000007
        description: Disease Specific Research - This data use permission indicates that use is allowed provided it is related to the specified disease. If providing this term, please provide the disease MONDO ID(s) in column diseaseSpecificResearch.
      DUOPlus1:
        meaning: gov:DUOPlus1
        description: Source geography is relevant to governance decisions. If providing this term, please provide the applicable country code(s) in column sourceGeography.
        implements: [DUO:0000017]
      DUOPlus2:
        meaning: gov:DUOPlus2
        description: Study population is relevant to governance decisions. If providing this term, please provide the applicable population type(s) in column populationType.
        implements: [DUO:0000017]
      DUOPlus3:
        meaning: gov:DUOPlus3
        description: Data deidentification is relevant to governance decisions. If providing this term, please provide the applicable deidentification type(s) in column deidentificationType.
        implements: [DUO:0000017]
      DUOPlus4:
        meaning: gov:DUOPlus4
        description: A data permission designation is associated with the Study. If providing this term, please provide the applicable permission type(s) in column dataPermission.
        implements: [DUO:0000017]
      DUOPlus5:
        meaning: gov:DUOPlus5
        description: A data tier designation is associated with the Study. If providing this term, please provide the applicable data tier designation(s) in column dataTier.
        implements: [DUO:0000017]
      DUOPlus6:
        meaning: gov:DUOPlus6
        description: A license is associated with the Study. If providing this term, please provide the applicable license in column license.
        implements: [DUO:0000017]
      DUOPlus7:
        meaning: gov:DUOPlus7
        description: Attribution conditions are associated with this Study. If providing this term, please provide the attribution statement in column attribution.
        implements: [DUO:0000017]
