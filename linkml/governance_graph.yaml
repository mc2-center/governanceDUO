id: https://w3id.org/sage-bionetworks/governance-duo/governance_graph
name: governance_duo_governance_graph
description: >-
  Captures the SageBrain "Governance Graph" design (see "SageBrain-Governance
  Graph Design for Authorization and Access Requirements" — a logically separate
  graph of ACLs and Access Requirements, connected to the domain/scientific
  metadata graph only via shared Synapse entity URIs). The design doc's central
  point: ACLs and Access Requirements are different concepts — an ACL answers "who
  has which permission on this resource?" (AccessGrant); an Access Requirement
  answers "what additional conditions must be satisfied before the operation is
  permitted?" (the existing AccessRequirement class, plus AccessRequirementAssociation
  for how it's bound to a resource and DataAccessSubmission/DataAccessSubmissionStatus
  for whether a user has satisfied it). Effective access = ACL permits AND
  applicable ARs are satisfied.

  Every class/enum here was verified against a real source, not guessed: the two
  "sagebrain governance graph ACL_AR data" CSVs (Synapse's actual AR/ACL relational
  table schemas) for column existence and type, and live lookups (Synapse's own
  REST API docs and Java source on GitHub) for the controlled vocabularies those
  CSVs name but don't enumerate — see AccessTypeEnum/AccessRequirementConcreteTypeEnum
  in mixins.yaml and SubmissionStateEnum below for exactly what was verified where.

  scripts/build_governance_graph.py exports this schema's example instances as Turtle
  in this same `sagegov:` IRI space, but under the CURIE `gov:` instead of `sagegov:`
  (both resolve to https://sagebionetworks.org/governance/) — `gov:` was avoided here
  because it collides with linkml-lint's canonical-prefix registry entry for
  http://gov.genealogy.net/ontology.owl#, but the script controls its own Turtle
  serialization directly with rdflib, independent of this schema's prefix registry, so
  it uses the shorter `gov:` there. `gov:`/`sagegov:` are the same namespace, not two
  different ones. That same script also re-serializes this schema's dotted/underscored
  ids (e.g. `access_requirement.42`, `grant.001`) fully hyphenated (`gov:AR-42`,
  `gov:grant-001`) to structurally match the "SageBrain Governance Graph Design" doc's
  own literal snippets — see `gov_id()` in build_governance_graph.py for the exact
  transform; it is not expressible as a LinkML id_prefixes/pattern construct since it's
  a display-convention rename, not a distinct identifier scheme.
prefixes:
  governanceduo: https://w3id.org/sage-bionetworks/governance-duo/
  linkml: https://w3id.org/linkml/
  dcterms: http://purl.org/dc/terms/
  schema: http://schema.org/
  prov: http://www.w3.org/ns/prov#
  dpv: https://w3id.org/dpv#
  sagegov: https://sagebionetworks.org/governance/
default_prefix: governanceduo
default_range: string
imports:
  - linkml:types
  - base_entity
  - access_requirement
enums:
  SubmissionStateEnum:
    description: >-
      Synapse's real DataAccessSubmissionState values, verified via
      Sage-Bionetworks/SynapseWebClient source
      (ACTDataAccessSubmissionWidget.java's exhaustive state switch) — the
      "sagebrain governance graph ACL_AR data - AR table schemas.csv" only says
      DATA_ACCESS_SUBMISSION_STATUS.STATE is TEXT, with no NOTES-column value list.
    permissible_values:
      SUBMITTED: {}
      APPROVED: {}
      REJECTED: {}
      CANCELLED: {}
  BindingTypeEnum:
    description: >-
      Whether a governance relationship (an AccessGrant or
      AccessRequirementAssociation) applies directly to a resource or is
      inherited from a parent (e.g. a file inheriting its parent study's Access
      Requirement) — from the design doc's own `gov:bindingType gov:Inherited`
      example. Not a Synapse database column; ACCESS_REQUIREMENT_PROJECT and the
      ACL tables record only the direct binding, so inheritance has to be
      resolved (via SynapseEntity.parentId) and recorded explicitly, per the
      design doc's "Direct and Inherited Governance" section.
    permissible_values:
      Direct: {}
      Inherited: {}
  PrincipalTypeEnum:
    description: >-
      Whether a Principal is an individual user or a team — from the design
      doc: "Principals may represent either individual users or teams."
      ACL_RESOURCE_ACCESS.GROUP_ID itself doesn't distinguish the two; Synapse
      resolves that from the id's own type at runtime, so this is recorded
      explicitly here rather than inferred.
    permissible_values:
      User: {}
      Team: {}
  ApprovalStateEnum:
    description: >-
      Synapse's real AccessApproval state values
      (org.sagebionetworks.repo.model.ApprovalState), verified directly
      against the OpenAPI spec -- APPROVED/REVOKED only. A distinct, smaller
      enum from SubmissionStateEnum above; do not conflate the two even though
      both happen to include "APPROVED".
    permissible_values:
      APPROVED: {}
      REVOKED: {}
classes:
  SynapseEntity:
    is_a: BaseEntity
    class_uri: sagegov:SynapseEntity
    description: >-
      A concrete Synapse entity (project, folder, file, etc.) that ACLs and
      Access Requirements attach to. Mirrors the NODE table. Deliberately
      separate from the Resource class: Resource represents a reusable
      resource-*type* pattern (e.g. "mc2Res1"), not a concrete entity instance
      with real parent/child structure.
    close_mappings:
      - prov:Entity
    slot_usage:
      id:
        description: The Synapse entity id (NODE.ID), e.g. syn10081783.
        pattern: '^syn\d+$'
        examples:
          - value: syn10081783
      name:
        slot_uri: sagegov:name
      etag:
        slot_uri: sagegov:etag
      currentRevNum:
        slot_uri: sagegov:currentRevNum
      createdOn:
        slot_uri: sagegov:createdOn
      createdBy:
        slot_uri: sagegov:createdByUserId
        comments:
          - 'On SynapseEntity specifically, this is a raw literal Synapse user id
            (sagegov:createdByUserId), not an IRI reference -- see mixins.yaml''s
            createdBy comment for why this diverges from DataAccessSubmission''s
            usage of the same underlying slot.'
    slots:
      - name
      - nodeType
      - parentId
      - alias
      - currentRevNum
      - maxRevNum
      - etag
      - createdBy
      - createdOn
  Principal:
    class_uri: sagegov:Principal
    description: >-
      A Synapse user or team being granted access via an ACL. Mirrors
      ACL_RESOURCE_ACCESS.GROUP_ID (the id of the user or team being granted
      access) with an explicit type discriminator, since a bare GROUP_ID doesn't
      distinguish the two on its own. Deliberately not `is_a: BaseEntity`, and for a
      different reason than DataAccessSubmissionStatus's (see that class's own
      description): unlike AccessGrant/AccessRequirementAssociation/
      DataAccessSubmission -- which mint a *synthetic* BaseEntity id specifically
      because their underlying Synapse tables have no single natural key for the
      merged, first-class thing being modeled -- GROUP_ID already *is* a real,
      unambiguous, already-existing natural key (Synapse's own numeric
      Principal/UserGroup id), so there's nothing to synthesize. It's also an
      integer, not a string, so reusing BaseEntity's generically string-typed `id`
      slot would require both a range override and renaming this attribute from
      principalId to literally `id` (slot_usage overrides a slot's attributes; it
      can't let a differently-named slot stand in for it) -- sacrificing the direct
      principalId <-> ACL_RESOURCE_ACCESS.GROUP_ID column traceability this schema
      preserves everywhere else (see SynapseAccessRequirementMixin's real-column-name
      convention).

      `company` mirrors Synapse's real UserProfile.company field ("This
      person's current affiliation") -- a genuine per-Principal institution
      signal, verified directly against the OpenAPI spec, resolving the
      target ontology's gov:affiliatedWith (Principal -> Site) as real data,
      not just an aspiration (see
      plans/governance_graph_open_questions.md Section C). Only meaningful for
      `principalType: User`: Synapse's real Team object has no
      institution/affiliation field of its own.
    close_mappings:
      - prov:Agent
    slots:
      - principalId
      - principalType
      - company
  AccessGrant:
    is_a: BaseEntity
    class_uri: sagegov:AccessGrant
    description: >-
      A first-class ACL grant: resource, principal, permission(s), source, and
      whether the grant is direct or inherited. Mirrors ACL + ACL_RESOURCE_ACCESS
      + ACL_RESOURCE_ACCESS_TYPE. Answers "who has which permission on this
      resource?" — distinct from AccessRequirementAssociation, which answers
      "what additional conditions must be satisfied?" (the design doc's central
      ACL-vs-AR distinction).
    close_mappings:
      - schema:DigitalDocumentPermissionType
      - dpv:AuthorisationProtocols
    slot_usage:
      id:
        description: >-
          A synthetic identifier for this grant record (Synapse's ACL/
          ACL_RESOURCE_ACCESS tables have their own internal numeric ids, traced
          via sourceAclId/sourceAclResourceAccessId below, but no single
          natural key for "this grant" as a first-class thing — the design doc
          itself mints one, e.g. gov:grant-001).
        pattern: '^grant\.[A-Za-z0-9_-]+$'
        examples:
          - value: grant.001
      createdOn:
        slot_uri: sagegov:createdOn
    slots:
      - resource
      - principal
      - permission
      - source
      - bindingType
      - createdOn
      - sourceAclId
      - sourceAclResourceAccessId
  AccessRequirementAssociation:
    is_a: BaseEntity
    class_uri: sagegov:AccessRequirementAssociation
    description: >-
      Binds an AccessRequirement to a resource, recording whether the binding
      is direct or inherited. Mirrors ACCESS_REQUIREMENT_PROJECT, extended with
      the design doc's explicit direct/inherited distinction —
      ACCESS_REQUIREMENT_PROJECT itself has no binding-type column; that
      inheritance concept is this repo's own addition to capture what the
      design doc calls for (see BindingTypeEnum).
    slot_usage:
      id:
        description: >-
          A synthetic identifier for this association record.
          ACCESS_REQUIREMENT_PROJECT is a pure join table (AR_ID, PROJECT_ID —
          no id column of its own), so this mirrors the design doc's own
          gov:ar-association-001 naming rather than a real Synapse column.
        pattern: '^ar_association\.[A-Za-z0-9_-]+$'
        examples:
          - value: ar_association.001
    slots:
      - resource
      - accessRequirement
      - source
      - bindingType
  DataAccessSubmission:
    is_a: BaseEntity
    class_uri: sagegov:DataAccessSubmission
    description: >-
      A user's application against an AccessRequirement. Mirrors
      DATA_ACCESS_SUBMISSION. Represents the design doc's "user satisfaction"
      side of an Access Requirement (gov:hasSignedAgreement / gov:hasApproval)
      as an explicit, auditable record rather than a precomputed boolean.

      Field names below were corrected to match Synapse's live REST API object
      (`org.sagebionetworks.repo.model.dataaccess.Submission`, per the OpenAPI
      spec), not just the original DATA_ACCESS_SUBMISSION table-column guess:
      the live API names the submitter/timestamp fields `submittedBy`/
      `submittedOn` (not `createdBy`/`createdOn`), the originating request
      `requestId` (not `dataAccessRequestId`), and exposes `modifiedBy` directly
      on Submission itself -- moved here from DataAccessSubmissionStatus, which
      does not carry it in the live API (see that class's own description).
    slot_usage:
      id:
        description: >-
          A unique identifier for this submission (schematic-schema-style
          dotted string, per this repo's id convention — see base_entity.yaml —
          wrapping Synapse's own numeric DATA_ACCESS_SUBMISSION.ID).
        pattern: '^data_access_submission\.\d+$'
        examples:
          - value: data_access_submission.555
      etag:
        slot_uri: sagegov:etag
    slots:
      - accessRequirementId
      - accessRequirementVersion
      - requestId
      - researchProjectId
      - submittedBy
      - submittedOn
      - modifiedBy
      - etag
  DataAccessSubmissionStatus:
    description: >-
      The approval-workflow state of a DataAccessSubmission. Mirrors
      DATA_ACCESS_SUBMISSION_STATUS, which has no independent identifier of its
      own in Synapse's schema (only a SUBMISSION_ID foreign key) — modeled here
      as a plain class keyed by submissionId, not a BaseEntity subclass, for the
      same reason.

      Slots corrected against Synapse's live `SubmissionStatus` REST object
      (`org.sagebionetworks.repo.model.dataaccess.SubmissionStatus`): it carries
      only `submissionId`/`submittedBy`/`rejectedReason`/`state`/`modifiedOn` --
      no `createdBy`/`createdOn`/`modifiedBy` at all (those were this schema's
      earlier, DB-table-column-based guess; `modifiedBy` is real but lives on
      `Submission` itself -- see DataAccessSubmission above). `submittedBy` is
      intentionally not re-declared here even though the live object carries
      it: it would be redundant with DataAccessSubmission.submittedBy on the
      same merged RDF subject (see scripts/build_governance_graph.py's merge
      design).
    slots:
      - submissionId
      - state
      - rejectedReason
      - modifiedOn
  Condition:
    class_uri: sagegov:Condition
    description: >-
      A single DUO-code-backed condition on an AccessRequirement, surfacing
      GovernanceMixin's dataUseModifiers/companion-slot data -- already
      present in this repo's AccessRequirement examples -- as a first-class
      graph node instead of leaving it invisible on the gov:AccessRequirement
      stub (see scripts/build_governance_graph.py's TYPE("AccessRequirement")
      comment for why that stub has its own, separate node). Mirrors the
      shape of a gov:Condition example proposed in review on sagebrain-infra
      PR #54 (thomasyu888,
      https://github.com/Sage-Bionetworks-IT/sagebrain-infra/pull/54#discussion_r3926030399),
      built from real data already in this repo, not a new source of truth --
      see plans/rebac_governance_graph_alignment.md for the full rationale.
      Not `is_a: BaseEntity`: like DataAccessSubmissionStatus, it has no
      independent identifier of its own in Synapse's schema -- it's keyed
      structurally by (AccessRequirement, duoCode/conditionType), not a
      synthesized dotted id.
    slots:
      - conditionType
      - duoCode
      - description
      - conditionDetail
  AccessApproval:
    is_a: BaseEntity
    class_uri: sagegov:AccessApproval
    description: >-
      Records that a Principal has been approved for access under an
      AccessRequirement. Mirrors Synapse's real AccessApproval REST object
      (org.sagebionetworks.repo.model.AccessApproval) -- a *separate* object
      from DataAccessSubmission/DataAccessSubmissionStatus (the workflow/audit
      trail that produces one), verified directly against
      rest-docs.synapse.org and the OpenAPI spec. Maps onto the target
      ontology (proposed in review on sagebrain-infra PR #54) as gov:Approval:
      gov:satisfies (requirementId), gov:heldBy (accessorId), gov:status
      (this class's own status slot -- range ApprovalStateEnum, deliberately
      not the shared "state" slot, which ranges over the unrelated
      SubmissionStateEnum), gov:expiresAt (expiredOn).

      gov:hasApproval (Principal -> AccessRequirement) is re-derived from this
      class (status == APPROVED) as the primary source going forward -- see
      add_access_approval() in build_governance_graph.py. The existing
      DataAccessSubmissionStatus-sourced gov:hasApproval edge is left as-is,
      not replaced (authorize.py's SPARQL contract touches neither). See
      plans/governance_graph_open_questions.md Section B.
    slot_usage:
      id:
        description: >-
          A synthetic identifier for this approval record (Synapse's real
          AccessApproval.id, traced via sourceApprovalId below, has no
          dotted-string form of its own -- mirrors this repo's id convention
          for every other BaseEntity here).
        pattern: '^access_approval\.\d+$'
        examples:
          - value: access_approval.9001
      createdOn:
        slot_uri: sagegov:createdOn
      etag:
        slot_uri: sagegov:etag
    slots:
      - requirementId
      - requirementVersion
      - submitterId
      - accessorId
      - status
      - expiredOn
      - createdOn
      - sourceApprovalId
      - etag
  ResearchProject:
    is_a: BaseEntity
    class_uri: sagegov:ResearchProject
    description: >-
      Documents the research context/justification behind a
      DataAccessRequest (and, by extension, a DataAccessSubmission). Mirrors
      Synapse's real ResearchProject REST object
      (org.sagebionetworks.repo.model.dataaccess.ResearchProject), verified
      against rest-docs.synapse.org and the OpenAPI spec. Replaces the bare
      researchProjectId FK integer literal DataAccessSubmission previously
      carried with a real node + edge. See
      plans/governance_graph_open_questions.md Section C.
    slot_usage:
      id:
        description: >-
          A unique identifier for this research project (schematic-schema-style
          dotted string wrapping Synapse's own string ResearchProject.id, same
          id convention as DataAccessSubmission).
        pattern: '^research_project\.\d+$'
        examples:
          - value: research_project.8001
      createdBy:
        slot_uri: sagegov:createdBy
        comments:
          - 'ResearchProject.createdBy is the "who authored this record"
            concept, emitted as an IRI reference to a sagegov:Principal node
            -- distinct from DataAccessSubmission''s sagegov:submittedBy
            (the workflow-submission-action concept) and
            SynapseEntity''s sagegov:createdByUserId (a raw literal).'
      createdOn:
        slot_uri: sagegov:createdOn
      etag:
        slot_uri: sagegov:etag
    slots:
      - accessRequirementId
      - institution
      - projectLead
      - intendedDataUseStatement
      - createdBy
      - createdOn
      - etag
  Site:
    class_uri: sagegov:Site
    description: >-
      An institution real Synapse data associates with a ResearchProject,
      DataAccessRequest, or User-type Principal. Synapse never gives a stable
      Site id, only a free-text institution/company name string
      (ResearchProject.institution / DataAccessRequest.institution /
      UserProfile.company -- all three real fields hold the same shape), so
      gov:Site nodes are minted deterministically by slugifying that name
      (see site_node_for() in build_governance_graph.py) -- the same "derive
      a stable node from real but non-id-shaped data" pattern
      add_principal() already uses for bare integer ids. Not `is_a:
      BaseEntity` for the same reason. gov:affiliatedWith (from
      ResearchProject/DataAccessRequest/Principal to this class) is a derived
      convenience triple with no governance_graph.yaml slot backing it, same
      as gov:hasACL/gov:hasAccessRequirement/gov:hasCondition -- it's never
      present in any source data, only computed by the script. See
      plans/governance_graph_open_questions.md Section C.
    slots:
      - institution
      - participatesIn
  DataAccessRequest:
    is_a: BaseEntity
    class_uri: sagegov:DataAccessRequest
    description: >-
      A user's draft/submitted request against an AccessRequirement, behind a
      DataAccessSubmission. Mirrors Synapse's real RequestInterface/Request/
      Renewal REST objects (org.sagebionetworks.repo.model.dataaccess),
      verified against the OpenAPI spec directly -- rest-docs.synapse.org's
      page for this object 403'd, so the spec was the only source (see
      plans/governance_graph_open_questions.md Section C.1). Field names
      deliberately differ from DataAccessSubmission's (corrected) ones:
      RequestInterface genuinely uses createdBy/createdOn/modifiedBy/
      modifiedOn, not submittedBy/submittedOn -- these are two different real
      Synapse objects, not the same field-naming convention applied twice.

      `principalInvestigator`/`signingOfficial` are real nested sub-objects in
      the live API (userId/name/institutionalEmail and
      name/institutionalEmail respectively), flattened here into literal
      slots rather than given their own nested classes: neither has an
      independent identifier of its own, and nothing else in this graph needs
      to reference them individually. `signingOfficial` in particular is a
      plausible seed for richer Site-level-authority modeling later, noted as
      future work rather than built now that Principal.company/
      gov:affiliatedWith covers the more general per-Principal case with real
      data already.
    slot_usage:
      id:
        description: >-
          A unique identifier for this request (schematic-schema-style dotted
          string wrapping Synapse's own string RequestInterface.id, same id
          convention as DataAccessSubmission/ResearchProject).
        pattern: '^data_access_request\.\d+$'
        examples:
          - value: data_access_request.7001
      createdBy:
        slot_uri: sagegov:createdBy
        comments:
          - 'Reuses ResearchProject''s sagegov:createdBy predicate -- both are
            the "who authored this record" concept, emitted as an IRI
            reference to a sagegov:Principal node.'
      createdOn:
        slot_uri: sagegov:createdOn
      etag:
        slot_uri: sagegov:etag
    slots:
      - accessRequirementId
      - researchProjectId
      - institution
      - requestPrincipalInvestigatorName
      - requestPrincipalInvestigatorEmail
      - requestSigningOfficialName
      - requestSigningOfficialEmail
      - createdBy
      - createdOn
      - modifiedBy
      - modifiedOn
      - etag
      - requestConcreteType
      - publication
      - summaryOfUse
  AccessRequirementTemplate:
    is_a: BaseEntity
    class_uri: sagegov:AccessRequirementTemplate
    description: >-
      A reusable set of DUO-backed Conditions an IRBRequirement can extend.
      **Honest grounding note**: no real Synapse or repo data source exists
      for AR-template reuse itself -- verified directly that Synapse's
      AccessRequirement has no template/inheritance mechanism at all, only
      subjectIds. This class ships as structural capability, populated with
      one illustrative example that reuses real Condition data (see
      hasCondition below), not presented as sourced from a specific real AR.
      `is_a: BaseEntity` for a synthetic dotted id, same reasoning as
      AccessGrant/AccessRequirementAssociation: no single natural key exists
      for "this template" as a first-class thing. See
      plans/governance_graph_open_questions.md Section C.2.
    slot_usage:
      id:
        description: A synthetic identifier for this template.
        pattern: '^access_requirement_template\.[A-Za-z0-9_-]+$'
        examples:
          - value: access_requirement_template.ar-genomics
    slots:
      - domain
      - hasCondition
  IRBRequirement:
    is_a: BaseEntity
    class_uri: sagegov:IRBRequirement
    description: >-
      A site/program-specific instantiation of an AccessRequirementTemplate,
      per the target ontology proposed in review on sagebrain-infra PR #54
      (thomasyu888,
      https://github.com/Sage-Bionetworks-IT/sagebrain-infra/pull/54#discussion_r3926030399).
      studyId bridges to this repo's existing, *real* governanceduo:Study
      class via the same owl:sameAs pattern
      add_access_requirement_association() already uses for gov:AR-<n> <->
      governanceduo:access_requirement.<n> -- Study has a real example
      (study.mc2-jax-5xfad) and a real AccessRequirementKey link to an
      AccessRequirement, so this is a genuine integration point, not an
      invented one. `institution` (reusing ResearchProject/DataAccessRequest's
      own slot) drives `scopedToSite` the same way it drives
      `gov:affiliatedWith` elsewhere -- not independently re-emitted.
      `is_a: BaseEntity` for a synthetic dotted id, same reasoning as
      AccessRequirementTemplate above. See
      plans/governance_graph_open_questions.md Section C.2.
    slot_usage:
      id:
        description: A synthetic identifier for this IRB requirement instance.
        pattern: '^irb_requirement\.[A-Za-z0-9_-]+$'
        examples:
          - value: irb_requirement.irb-genomics-adkp
    slots:
      - extendsTemplate
      - arType
      - studyId
      - language
      - scopedToProgram
      - scopedToSite
      - institution
  Program:
    is_a: BaseEntity
    class_uri: sagegov:Program
    description: >-
      A multi-site research consortium (e.g. AD Knowledge Portal, NF-OSI).
      **Honest grounding note**: no real Synapse or repo data source exists
      for Program-level grouping -- ships as structural capability with one
      clearly-illustrative example instance, the same treatment
      thomasyu888's own PR #54 comment gave its illustrative
      ex:program-adkp/ex:site-jhu data (the whole PR is explicitly a
      concept/PoC). Do not conflate this with the existing, real
      governanceduo:Study class, which models a single research study one
      level more granular than a Program -- see IRBRequirement's studyId
      description. `is_a: BaseEntity` for a synthetic dotted id, same
      reasoning as AccessRequirementTemplate above. See
      plans/governance_graph_open_questions.md Section C.2.
    slot_usage:
      id:
        description: A synthetic identifier for this program.
        pattern: '^program\.[A-Za-z0-9_-]+$'
        examples:
          - value: program.adkp
      name:
        slot_uri: sagegov:name
    slots:
      - name
slots:
  nodeType:
    slot_uri: sagegov:nodeType
    description: >-
      The kind of Synapse entity (NODE.NODE_TYPE), e.g. project, folder, file,
      table. **Not independently verified** against a canonical enum in this
      pass — modeled as an open string rather than a fabricated enum, unlike
      AccessTypeEnum/AccessRequirementConcreteTypeEnum/SubmissionStateEnum
      above, all three of which were confirmed against a real source. Common
      Synapse entity types (project/folder/file/link/table/view/dockerrepo) are
      well known but not cited here as a closed, checked list.
  parentId:
    slot_uri: sagegov:parentId
    description: >-
      The parent Synapse entity in the containment hierarchy (NODE.PARENT_ID) —
      used to resolve direct-vs-inherited governance (e.g. a file inheriting
      its parent study's Access Requirement, per the design doc's
      "Direct and Inherited Governance" section).
    range: SynapseEntity
    exact_mappings:
      - dcterms:isPartOf
  alias:
    slot_uri: sagegov:alias
    description: The Synapse entity's alias (NODE.ALIAS), if any.
  maxRevNum:
    slot_uri: sagegov:maxRevNum
    description: The maximum revision number of this Synapse entity (NODE.MAX_REV_NUM).
  principalId:
    slot_uri: sagegov:principalId
    description: The Synapse numeric id of the user or team (ACL_RESOURCE_ACCESS.GROUP_ID).
    range: integer
    identifier: true
    required: true
  principalType:
    range: PrincipalTypeEnum
    required: true
  resource:
    slot_uri: sagegov:resource
    description: The SynapseEntity this grant/association applies to.
    range: SynapseEntity
    required: true
  principal:
    slot_uri: sagegov:principal
    description: The user or team this grant applies to.
    range: Principal
    required: true
    close_mappings:
      - prov:agent
  permission:
    slot_uri: sagegov:permission
    description: >-
      The permission(s) granted (ACL_RESOURCE_ACCESS_TYPE.STRING_ELE).
      Multivalued: a single ACL_RESOURCE_ACCESS row can carry more than one
      permission type.
    range: AccessTypeEnum
    multivalued: true
    required: true
  source:
    slot_uri: sagegov:source
    description: The system this grant/association was derived from, e.g. "Synapse".
    exact_mappings:
      - dcterms:source
  bindingType:
    slot_uri: sagegov:bindingType
    range: BindingTypeEnum
    required: true
  sourceAclId:
    slot_uri: sagegov:sourceAclId
    description: Traceability back to the literal ACL.ID row this grant was derived from.
    range: integer
  sourceAclResourceAccessId:
    slot_uri: sagegov:sourceAclResourceAccessId
    description: Traceability back to the literal ACL_RESOURCE_ACCESS.ID row this grant was derived from.
    range: integer
  accessRequirement:
    slot_uri: sagegov:accessRequirement
    description: The AccessRequirement this association binds to the resource.
    range: AccessRequirement
    required: true
    close_mappings:
      - dcterms:requires
  accessRequirementId:
    slot_uri: sagegov:accessRequirement
    description: >-
      The AccessRequirement this submission is an application against
      (DATA_ACCESS_SUBMISSION.ACCESS_REQUIREMENT_ID).
    range: AccessRequirement
    required: true
    close_mappings:
      - dcterms:requires
    comments:
      - 'slot_uri intentionally reuses sagegov:accessRequirement, the same predicate
        AccessRequirementAssociation.accessRequirement uses, even though this is a
        differently-named LinkML slot -- so "what AccessRequirement does this
        concern?" is a uniform gov:accessRequirement query regardless of subject
        class. See scripts/build_governance_graph.py.'
  accessRequirementVersion:
    description: >-
      The version of the AccessRequirement this submission was made against
      (DATA_ACCESS_SUBMISSION.ACCESS_REQUIREMENT_VERSION).
    range: integer
  requestId:
    slot_uri: sagegov:requestId
    description: >-
      The originating data access request. Synapse's live API names this
      field `requestId` (`org.sagebionetworks.repo.model.dataaccess.Submission`),
      not `dataAccessRequestId`; the underlying DB column is
      DATA_ACCESS_SUBMISSION.DATA_ACCESS_REQUEST_ID. Range is now
      `DataAccessRequest` (was a bare integer literal until that class
      existed -- see plans/governance_graph_open_questions.md Section C.1) --
      emitted as an IRI reference to the real `gov:DataAccessRequest-<n>`
      node.
    range: DataAccessRequest
  researchProjectId:
    slot_uri: sagegov:researchProject
    description: >-
      The research project this submission/request is associated with
      (DATA_ACCESS_SUBMISSION.RESEARCH_PROJECT_ID /
      RequestInterface.researchProjectId). Range is now `ResearchProject`
      (was a bare integer literal until that class existed -- see
      plans/governance_graph_open_questions.md Section C) -- emitted as an
      IRI reference to the real `gov:research-project-<n>` node. Shared
      predicate across DataAccessSubmission and DataAccessRequest, both of
      which reference the same real-world ResearchProject.
    range: ResearchProject
    comments:
      - 'DATA_ACCESS_SUBMISSION.SUBMISSION_SERIALIZED (a BINARY blob, presumably
        the full submission form data) is not modeled as a structured field.'
  submissionId:
    description: The DataAccessSubmission this status record applies to (DATA_ACCESS_SUBMISSION_STATUS.SUBMISSION_ID).
    range: DataAccessSubmission
    required: true
  state:
    slot_uri: sagegov:state
    range: SubmissionStateEnum
    required: true
  rejectedReason:
    slot_uri: sagegov:rejectedReason
    description: >-
      The reason this submission was rejected, if it was. Synapse's live API
      names this field `rejectedReason`
      (`org.sagebionetworks.repo.model.dataaccess.SubmissionStatus`), not
      `reason`; stored as DATA_ACCESS_SUBMISSION_STATUS.REASON (a BINARY
      column) in the underlying table.
  submittedBy:
    slot_uri: sagegov:submittedBy
    description: >-
      Synapse numeric user id of who submitted this record
      (`Submission.submittedBy` in Synapse's live REST API). Emitted as an IRI
      reference to a sagegov:Principal node (looked up by this numeric id), not
      a literal -- see scripts/build_governance_graph.py.
    range: integer
  submittedOn:
    slot_uri: sagegov:submittedOn
    description: >-
      When this record was submitted (epoch milliseconds; `Submission.submittedOn`
      in Synapse's live REST API).
    range: integer
  modifiedBy:
    slot_uri: sagegov:modifiedBy
    description: >-
      Synapse numeric user id of who last modified this record. On
      DataAccessSubmission, this is `Submission.modifiedBy` in Synapse's live
      REST API (moved here from DataAccessSubmissionStatus, which does not
      carry this field live; see DataAccessSubmissionStatus's own
      description); on DataAccessRequest, it's `RequestInterface.modifiedBy`.
      Emitted as an IRI reference to a sagegov:Principal node, not a literal,
      mirroring submittedBy above.
    range: integer
    close_mappings:
      - dcterms:contributor
  modifiedOn:
    slot_uri: sagegov:modifiedOn
    description: >-
      When this record was last modified (epoch milliseconds). On
      DataAccessSubmissionStatus this is emitted under the distinct
      gov:statusModifiedOn predicate instead (a bare constant in
      build_governance_graph.py, not resolved via this slot_uri -- see that
      class's own description); DataAccessRequest resolves it via this slot's
      own sagegov:modifiedOn directly.
    range: integer
    exact_mappings:
      - dcterms:modified
  conditionType:
    slot_uri: sagegov:conditionType
    description: >-
      A short label for this condition. For the 24 real DUO codes in
      DataUseModifierEnum, this is that code's own duo_shorthand annotation
      (e.g. "GRU", "COL"); the 7 Sage-local DUOPlus1-7 extensions have no
      duo_shorthand/meaning: CURIE at all, so their bare enum key (e.g.
      "DUOPlus1") is used instead -- see scripts/build_governance_graph.py.
  duoCode:
    slot_uri: sagegov:duoCode
    description: >-
      The real DUO CURIE this condition represents, when one exists.
      Deliberately not required: the 7 Sage-local DUOPlus1-7 extensions in
      DataUseModifierEnum have no meaning: CURIE at all -- see conditionType
      above for how those are represented instead.
    range: DataUseModifierEnum
  description:
    slot_uri: sagegov:description
    description: >-
      Human-readable description of this condition, taken directly from
      DataUseModifierEnum.permissible_values[code]'s own description: text,
      not re-authored here.
    exact_mappings:
      - dcterms:description
  conditionDetail:
    slot_uri: sagegov:conditionDetail
    description: >-
      Zero or more companion-slot values from the source AccessRequirement,
      one per GovernanceMixin.rules entry whose precondition matches this
      condition's duoCode/conditionType and whose postcondition slot is
      actually populated on the instance (e.g. the geographicalRestriction
      value(s) for DUO:0000022). Multivalued because GovernanceMixin.rules is
      genuinely many-to-many -- some codes have multiple companion slots,
      some companion slots serve multiple codes -- not because any single
      condition's own detail is inherently list-valued. See
      scripts/build_governance_graph.py.
    multivalued: true
  company:
    slot_uri: sagegov:company
    description: >-
      Institution/company name, verbatim from Synapse's real
      UserProfile.company field ("This person's current affiliation").
      Consumed by build_governance_graph.py's site_node_for() to derive a
      gov:affiliatedWith edge to a gov:Site node -- not independently
      re-emitted as its own literal predicate on the Principal subject. Only
      meaningful for `principalType: User`.
  requirementId:
    slot_uri: sagegov:satisfies
    description: >-
      The AccessRequirement this approval satisfies (AccessApproval.requirementId
      in Synapse's live REST API). Distinct LinkML slot from
      AccessRequirementAssociation.accessRequirement/
      DataAccessSubmission.accessRequirementId (which share
      sagegov:accessRequirement) -- this one maps onto the target ontology's
      gov:satisfies predicate instead, since AccessApproval specifically
      represents *satisfaction* of a requirement, not just a binding or an
      application against it.
    range: AccessRequirement
    required: true
  requirementVersion:
    slot_uri: sagegov:requirementVersion
    description: >-
      The version of the AccessRequirement this approval satisfies
      (AccessApproval.requirementVersion).
    range: integer
  submitterId:
    slot_uri: sagegov:submittedBy
    description: >-
      Synapse numeric user id of who performed the actions to gain this
      approval (AccessApproval.submitterId). Reuses DataAccessSubmission's
      sagegov:submittedBy predicate -- same real-world concept (who acted on
      the governance workflow), emitted as an IRI reference to a
      sagegov:Principal node, not a literal.
    range: integer
  accessorId:
    slot_uri: sagegov:heldBy
    description: >-
      Synapse numeric id of the Principal approved for access
      (AccessApproval.accessorId). Emitted as an IRI reference to a
      sagegov:Principal node, mapping onto the target ontology's gov:heldBy
      predicate.
    range: integer
    required: true
  status:
    slot_uri: sagegov:status
    description: >-
      The state of this approval (AccessApproval.state in Synapse's live REST
      API -- renamed to "status" here specifically to avoid colliding with
      DataAccessSubmission/Status's own "state" slot, which ranges over the
      unrelated SubmissionStateEnum). Maps onto the target ontology's
      gov:status.
    range: ApprovalStateEnum
    required: true
  expiredOn:
    slot_uri: sagegov:expiresAt
    description: >-
      When this approval will expire (epoch milliseconds;
      AccessApproval.expiredOn in Synapse's live REST API). Maps onto the
      target ontology's gov:expiresAt -- the real field
      plans/rebac_governance_graph_alignment.md's first draft was wrong to
      call an unsourceable gap; see that plan's corrected Grounding section.
    range: integer
  sourceApprovalId:
    slot_uri: sagegov:sourceApprovalId
    description: Traceability back to the literal AccessApproval.id row this record was derived from.
    range: integer
  institution:
    slot_uri: sagegov:institution
    description: >-
      Institution/company name, verbatim from Synapse
      (ResearchProject.institution / DataAccessRequest.institution -- both
      real fields hold the same free-text shape as UserProfile.company
      above). On ResearchProject/DataAccessRequest, consumed by
      site_node_for() to derive a gov:affiliatedWith edge, not independently
      re-emitted; on Site itself, this is the node's own display name and IS
      emitted directly.
  projectLead:
    slot_uri: sagegov:projectLead
    description: The person leading this research project (ResearchProject.projectLead).
  intendedDataUseStatement:
    slot_uri: sagegov:intendedDataUseStatement
    description: >-
      A few short paragraphs explaining how the controlled data will be used
      (ResearchProject.intendedDataUseStatement).
  requestPrincipalInvestigatorName:
    slot_uri: sagegov:requestPrincipalInvestigatorName
    description: >-
      Flattened from the live API's nested principalInvestigator.name
      (org.sagebionetworks.repo.model.dataaccess.PrincipalInvestigator) -- see
      DataAccessRequest's own class description for why this is flattened
      rather than given a nested class.
  requestPrincipalInvestigatorEmail:
    slot_uri: sagegov:requestPrincipalInvestigatorEmail
    description: Flattened from the live API's nested principalInvestigator.institutionalEmail.
  requestSigningOfficialName:
    slot_uri: sagegov:requestSigningOfficialName
    description: >-
      Flattened from the live API's nested signingOfficial.name
      (org.sagebionetworks.repo.model.dataaccess.SigningOfficial).
  requestSigningOfficialEmail:
    slot_uri: sagegov:requestSigningOfficialEmail
    description: Flattened from the live API's nested signingOfficial.institutionalEmail.
  requestConcreteType:
    slot_uri: sagegov:requestConcreteType
    description: >-
      Which kind of request this is -- literally "Request" or "Renewal"
      (RequestInterface.concreteType in Synapse's live REST API). Deliberately
      not named/typed the same as AccessRequirement's own concreteType slot
      (mixins.yaml, range AccessRequirementConcreteTypeEnum) -- these are two
      unrelated real Synapse concreteType fields on two different objects.
  publication:
    slot_uri: sagegov:publication
    description: >-
      Link(s) to publications that used the controlled data
      (Renewal.publication in Synapse's live REST API). Only present on
      renewal instances (requestConcreteType == "Renewal").
  summaryOfUse:
    slot_uri: sagegov:summaryOfUse
    description: >-
      Summary of how the data has been used (Renewal.summaryOfUse in
      Synapse's live REST API). Only present on renewal instances
      (requestConcreteType == "Renewal").
  domain:
    slot_uri: sagegov:domain
    description: Free-text research domain this template applies to, e.g. "genomics".
  hasCondition:
    slot_uri: sagegov:hasCondition
    description: >-
      The DUO-backed Conditions this template reuses -- the same gov:Condition
      class add_access_requirement() already mints from real dataUseModifiers
      data (see plans/rebac_governance_graph_alignment.md), attached here to
      an AccessRequirementTemplate instead of (or in addition to) an
      AccessRequirement stub.
    range: Condition
    multivalued: true
  extendsTemplate:
    slot_uri: sagegov:extendsTemplate
    description: The AccessRequirementTemplate this IRBRequirement extends.
    range: AccessRequirementTemplate
  arType:
    slot_uri: sagegov:arType
    description: Free-text access requirement type, e.g. "IRB".
  studyId:
    description: >-
      The Study (this repo's real governanceduo:Study class, study.yaml) this
      IRBRequirement's language was authored for. Bridged via owl:sameAs in
      build_governance_graph.py, not this slot's own slot_uri -- Study lives
      in a different namespace already bridged the same way AccessRequirement
      stubs are (see add_access_requirement_association()).
  language:
    slot_uri: sagegov:language
    description: Free-text consent/IRB language for this requirement.
  scopedToProgram:
    slot_uri: sagegov:scopedToProgram
    description: The Program this IRBRequirement is scoped to. Illustrative-only -- see Program's own description.
    range: Program
  scopedToSite:
    slot_uri: sagegov:scopedToSite
    description: The Site this IRBRequirement is scoped to.
    range: Site
  participatesIn:
    slot_uri: sagegov:participatesIn
    description: >-
      The Program a Site participates in. Illustrative-only -- see Program's
      own description.
    range: Program
