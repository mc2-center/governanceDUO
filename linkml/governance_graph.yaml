id: https://w3id.org/sage-bionetworks/governance-duo/governance_graph
name: governance_duo_governance_graph
description: >-
  Captures the SageBrain "Governance Graph" design (see "SageBrain-Governance
  Graph Design for Authorization and Access Requirements" — a logically separate
  graph of ACLs and Access Requirements, connected to the domain/scientific
  metadata graph only via shared Synapse entity URIs). The design doc's central
  point: ACLs and Access Requirements are different concepts — an ACL answers "who
  has which permission on this resource?" (AccessGrant); an Access Requirement
  answers "what additional conditions must be satisfied before the operation is
  permitted?" (the existing AccessRequirement class, plus AccessRequirementAssociation
  for how it's bound to a resource and DataAccessSubmission/DataAccessSubmissionStatus
  for whether a user has satisfied it). Effective access = ACL permits AND
  applicable ARs are satisfied.

  Every class/enum here was verified against a real source, not guessed: the two
  "sagebrain governance graph ACL_AR data" CSVs (Synapse's actual AR/ACL relational
  table schemas) for column existence and type, and live lookups (Synapse's own
  REST API docs and Java source on GitHub) for the controlled vocabularies those
  CSVs name but don't enumerate — see AccessTypeEnum/AccessRequirementConcreteTypeEnum
  in mixins.yaml and SubmissionStateEnum below for exactly what was verified where.
prefixes:
  governanceduo: https://w3id.org/sage-bionetworks/governance-duo/
  linkml: https://w3id.org/linkml/
  dcterms: http://purl.org/dc/terms/
  schema: http://schema.org/
  prov: http://www.w3.org/ns/prov#
  dpv: https://w3id.org/dpv#
  sagegov: https://sagebionetworks.org/governance/
default_prefix: governanceduo
default_range: string
imports:
  - linkml:types
  - base_entity
  - access_requirement
enums:
  SubmissionStateEnum:
    description: >-
      Synapse's real DataAccessSubmissionState values, verified via
      Sage-Bionetworks/SynapseWebClient source
      (ACTDataAccessSubmissionWidget.java's exhaustive state switch) — the
      "sagebrain governance graph ACL_AR data - AR table schemas.csv" only says
      DATA_ACCESS_SUBMISSION_STATUS.STATE is TEXT, with no NOTES-column value list.
    permissible_values:
      SUBMITTED: {}
      APPROVED: {}
      REJECTED: {}
      CANCELLED: {}
  BindingTypeEnum:
    description: >-
      Whether a governance relationship (an AccessGrant or
      AccessRequirementAssociation) applies directly to a resource or is
      inherited from a parent (e.g. a file inheriting its parent study's Access
      Requirement) — from the design doc's own `gov:bindingType gov:Inherited`
      example. Not a Synapse database column; ACCESS_REQUIREMENT_PROJECT and the
      ACL tables record only the direct binding, so inheritance has to be
      resolved (via SynapseEntity.parentId) and recorded explicitly, per the
      design doc's "Direct and Inherited Governance" section.
    permissible_values:
      Direct: {}
      Inherited: {}
  PrincipalTypeEnum:
    description: >-
      Whether a Principal is an individual user or a team — from the design
      doc: "Principals may represent either individual users or teams."
      ACL_RESOURCE_ACCESS.GROUP_ID itself doesn't distinguish the two; Synapse
      resolves that from the id's own type at runtime, so this is recorded
      explicitly here rather than inferred.
    permissible_values:
      User: {}
      Team: {}
classes:
  SynapseEntity:
    is_a: BaseEntity
    description: >-
      A concrete Synapse entity (project, folder, file, etc.) that ACLs and
      Access Requirements attach to. Mirrors the NODE table. Deliberately
      separate from the Resource class: Resource represents a reusable
      resource-*type* pattern (e.g. "mc2Res1"), not a concrete entity instance
      with real parent/child structure.
    close_mappings:
      - prov:Entity
    slot_usage:
      id:
        description: The Synapse entity id (NODE.ID), e.g. syn10081783.
        pattern: '^syn\d+$'
        examples:
          - value: syn10081783
    slots:
      - name
      - nodeType
      - parentId
      - alias
      - currentRevNum
      - maxRevNum
      - etag
      - createdBy
      - createdOn
  Principal:
    description: >-
      A Synapse user or team being granted access via an ACL. Mirrors
      ACL_RESOURCE_ACCESS.GROUP_ID (the id of the user or team being granted
      access) with an explicit type discriminator, since a bare GROUP_ID doesn't
      distinguish the two on its own.
    close_mappings:
      - prov:Agent
    slots:
      - principalId
      - principalType
  AccessGrant:
    is_a: BaseEntity
    description: >-
      A first-class ACL grant: resource, principal, permission(s), source, and
      whether the grant is direct or inherited. Mirrors ACL + ACL_RESOURCE_ACCESS
      + ACL_RESOURCE_ACCESS_TYPE. Answers "who has which permission on this
      resource?" — distinct from AccessRequirementAssociation, which answers
      "what additional conditions must be satisfied?" (the design doc's central
      ACL-vs-AR distinction).
    close_mappings:
      - schema:DigitalDocumentPermissionType
      - dpv:AuthorisationProtocols
    slot_usage:
      id:
        description: >-
          A synthetic identifier for this grant record (Synapse's ACL/
          ACL_RESOURCE_ACCESS tables have their own internal numeric ids, traced
          via sourceAclId/sourceAclResourceAccessId below, but no single
          natural key for "this grant" as a first-class thing — the design doc
          itself mints one, e.g. gov:grant-001).
        pattern: '^grant\.[A-Za-z0-9_-]+$'
        examples:
          - value: grant.001
    slots:
      - resource
      - principal
      - permission
      - source
      - bindingType
      - createdOn
      - sourceAclId
      - sourceAclResourceAccessId
  AccessRequirementAssociation:
    is_a: BaseEntity
    description: >-
      Binds an AccessRequirement to a resource, recording whether the binding
      is direct or inherited. Mirrors ACCESS_REQUIREMENT_PROJECT, extended with
      the design doc's explicit direct/inherited distinction —
      ACCESS_REQUIREMENT_PROJECT itself has no binding-type column; that
      inheritance concept is this repo's own addition to capture what the
      design doc calls for (see BindingTypeEnum).
    slot_usage:
      id:
        description: >-
          A synthetic identifier for this association record.
          ACCESS_REQUIREMENT_PROJECT is a pure join table (AR_ID, PROJECT_ID —
          no id column of its own), so this mirrors the design doc's own
          gov:ar-association-001 naming rather than a real Synapse column.
        pattern: '^ar_association\.[A-Za-z0-9_-]+$'
        examples:
          - value: ar_association.001
    slots:
      - resource
      - accessRequirement
      - source
      - bindingType
  DataAccessSubmission:
    is_a: BaseEntity
    description: >-
      A user's application against an AccessRequirement. Mirrors
      DATA_ACCESS_SUBMISSION. Represents the design doc's "user satisfaction"
      side of an Access Requirement (gov:hasSignedAgreement / gov:hasApproval)
      as an explicit, auditable record rather than a precomputed boolean.
    slot_usage:
      id:
        description: >-
          A unique identifier for this submission (schematic-schema-style
          dotted string, per this repo's id convention — see base_entity.yaml —
          wrapping Synapse's own numeric DATA_ACCESS_SUBMISSION.ID).
        pattern: '^data_access_submission\.\d+$'
        examples:
          - value: data_access_submission.555
    slots:
      - accessRequirementId
      - accessRequirementVersion
      - dataAccessRequestId
      - researchProjectId
      - createdBy
      - createdOn
      - etag
  DataAccessSubmissionStatus:
    description: >-
      The approval-workflow state of a DataAccessSubmission. Mirrors
      DATA_ACCESS_SUBMISSION_STATUS, which has no independent identifier of its
      own in Synapse's schema (only a SUBMISSION_ID foreign key) — modeled here
      as a plain class keyed by submissionId, not a BaseEntity subclass, for the
      same reason.
    slots:
      - submissionId
      - state
      - reason
      - createdBy
      - createdOn
      - modifiedBy
      - modifiedOn
slots:
  nodeType:
    description: >-
      The kind of Synapse entity (NODE.NODE_TYPE), e.g. project, folder, file,
      table. **Not independently verified** against a canonical enum in this
      pass — modeled as an open string rather than a fabricated enum, unlike
      AccessTypeEnum/AccessRequirementConcreteTypeEnum/SubmissionStateEnum
      above, all three of which were confirmed against a real source. Common
      Synapse entity types (project/folder/file/link/table/view/dockerrepo) are
      well known but not cited here as a closed, checked list.
  parentId:
    description: >-
      The parent Synapse entity in the containment hierarchy (NODE.PARENT_ID) —
      used to resolve direct-vs-inherited governance (e.g. a file inheriting
      its parent study's Access Requirement, per the design doc's
      "Direct and Inherited Governance" section).
    range: SynapseEntity
    exact_mappings:
      - dcterms:isPartOf
  alias:
    description: The Synapse entity's alias (NODE.ALIAS), if any.
  maxRevNum:
    description: The maximum revision number of this Synapse entity (NODE.MAX_REV_NUM).
  principalId:
    description: The Synapse numeric id of the user or team (ACL_RESOURCE_ACCESS.GROUP_ID).
    range: integer
    identifier: true
    required: true
  principalType:
    range: PrincipalTypeEnum
    required: true
  resource:
    description: The SynapseEntity this grant/association applies to.
    range: SynapseEntity
    required: true
  principal:
    description: The user or team this grant applies to.
    range: Principal
    required: true
    close_mappings:
      - prov:agent
  permission:
    description: >-
      The permission(s) granted (ACL_RESOURCE_ACCESS_TYPE.STRING_ELE).
      Multivalued: a single ACL_RESOURCE_ACCESS row can carry more than one
      permission type.
    range: AccessTypeEnum
    multivalued: true
    required: true
  source:
    description: The system this grant/association was derived from, e.g. "Synapse".
    exact_mappings:
      - dcterms:source
  bindingType:
    range: BindingTypeEnum
    required: true
  sourceAclId:
    description: Traceability back to the literal ACL.ID row this grant was derived from.
    range: integer
  sourceAclResourceAccessId:
    description: Traceability back to the literal ACL_RESOURCE_ACCESS.ID row this grant was derived from.
    range: integer
  accessRequirement:
    description: The AccessRequirement this association binds to the resource.
    range: AccessRequirement
    required: true
    close_mappings:
      - dcterms:requires
  accessRequirementId:
    description: >-
      The AccessRequirement this submission is an application against
      (DATA_ACCESS_SUBMISSION.ACCESS_REQUIREMENT_ID).
    range: AccessRequirement
    required: true
    close_mappings:
      - dcterms:requires
  accessRequirementVersion:
    description: >-
      The version of the AccessRequirement this submission was made against
      (DATA_ACCESS_SUBMISSION.ACCESS_REQUIREMENT_VERSION).
    range: integer
  dataAccessRequestId:
    description: The originating data access request id (DATA_ACCESS_SUBMISSION.DATA_ACCESS_REQUEST_ID).
    range: integer
  researchProjectId:
    description: The research project id this submission is associated with (DATA_ACCESS_SUBMISSION.RESEARCH_PROJECT_ID).
    range: integer
    comments:
      - 'DATA_ACCESS_SUBMISSION.SUBMISSION_SERIALIZED (a BINARY blob, presumably
        the full submission form data) is not modeled as a structured field.'
  submissionId:
    description: The DataAccessSubmission this status record applies to (DATA_ACCESS_SUBMISSION_STATUS.SUBMISSION_ID).
    range: DataAccessSubmission
    required: true
  state:
    range: SubmissionStateEnum
    required: true
  reason:
    description: >-
      The reason for the current state (e.g. a rejection reason). Stored as
      DATA_ACCESS_SUBMISSION_STATUS.REASON, a BINARY column in Synapse; modeled
      here as a plain string.
  modifiedBy:
    description: Synapse numeric user id of who last modified this status record.
    range: integer
    close_mappings:
      - dcterms:contributor
  modifiedOn:
    description: When this status record was last modified (epoch milliseconds).
    range: integer
    exact_mappings:
      - dcterms:modified
