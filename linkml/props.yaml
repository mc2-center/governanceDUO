id: https://w3id.org/sage-bionetworks/governance-duo/props
name: governance_duo_props
description: >-
  Cross-class slots and shared enums reused by more than one governanceDUO class.
  Mirrors SageCommonDataModel's props.yaml: imports only linkml:types, never an entity
  file, so this file (and mixins.yaml) can never participate in an import cycle.
prefixes:
  governanceduo: https://w3id.org/sage-bionetworks/governance-duo/
  linkml: https://w3id.org/linkml/
default_prefix: governanceduo
default_range: string
imports:
  - linkml:types
slots:
  AccessRequirementKey:
    description: >-
      The Access Requirement id(s) associated with this object. Provide multiple
      values as a comma-separated list.
    multivalued: true
    annotations:
      foreign_key: true
  StudyKey:
    description: >-
      The Study id(s) associated with this object. Provide multiple values as a
      comma-separated list.
    multivalued: true
    annotations:
      foreign_key: true
enums:
  GeographicalRegionEnum:
    description: >-
      ISO 3166-1 alpha-2 country codes. Shared by the shared/GovernanceMixin slots
      geographicalRestriction (DUO:0000022) and sourceGeography (DUOPlus1) — the
      source CSV (model/shared.model.csv) duplicated this same value list under both
      attributes; this schema keeps one enum and points both slots at it.
