id: https://w3id.org/sage-bionetworks/governance-duo/schema
name: governance_duo_schema
description: LinkML representation of the Schema component.
prefixes:
  governanceduo: https://w3id.org/sage-bionetworks/governance-duo/
  linkml: https://w3id.org/linkml/
  dcterms: http://purl.org/dc/terms/
default_prefix: governanceduo
default_range: string
imports:
  - linkml:types
  - base_entity
  - props
classes:
  Schema:
    description: Information that is relevant to resource access conditions.
    is_a: BaseEntity
    tree_root: true
    slot_usage:
      id:
        description: >-
          A unique identifier for the schema (schematic source attribute: Schema_id).
        pattern: '^schema\.[A-Za-z0-9_-]+$'
    slots:
      - ResourceKey
      - AccessRequirementKey
      - StudyKey
      - schemaUrl
slots:
  ResourceKey:
    description: >-
      The identifier(s) for the Resource(s) associated with this schema. Provide
      multiple values as a comma-separated list.
    comments:
      - 'Untyped string, not range: Resource -- see props.yaml''s AccessRequirementKey
        comment for why (this file cannot import resource.yaml without risking a
        cycle).'
    multivalued: true
    annotations:
      foreign_key: true
  schemaUrl:
    description: The registered URL associated with the access requirement JSON schema.
    exact_mappings:
      - dcterms:conformsTo
    comments:
      - 'dcterms:conformsTo, "An established standard to which the described
        resource conforms" — see resource.yaml''s registeredSchemaUrl for the same
        exact mapping and rationale.'
