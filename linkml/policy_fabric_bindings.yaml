        keyIsMultivalued: true
    requiredCredentials:
      - credentialType: AffiliationCredential
        requiredClaims: [isMemberOf]
      - credentialType: publicKeyCredential
        requiredClaims: [key]
    capabilityOperation: do_download
    notes:
      - "Uses the institutionDids slot, not the existing ROR-pattern institutionSpecificRestriction:
        AffiliationCredential.isMemberOf and allowedInstitutions both expect organization DIDs, not ROR ids."

  - dataUseModifier: DUO:0000026
    policyCardName: user-specific-restriction
    referenceValueKeys:
      - approvedUsers
      - allowedAccountTypes
      - requiredProfileStatuses
    referenceValueSources:
      - referenceValueKey: approvedUsers
        sourceSlot: approvedUsers
        keyIsMultivalued: true
      - referenceValueKey: allowedAccountTypes
        sourceSlot: allowedAccountTypes
        keyIsMultivalued: true
      - referenceValueKey: requiredProfileStatuses
        sourceSlot: requiredProfileStatuses
        keyIsMultivalued: true
    requiredCredentials:
      - credentialType: UserPlatformCredential
        requiredClaims: [userId, accountType, profileStatus]
      - credentialType: publicKeyCredential
        requiredClaims: [key]
    capabilityOperation: do_download
    notes:
      - "The pre-existing userSpecificRestriction slot is a single free-text string describing the
        restriction in prose; it is not reused here because this policy_card wants three separate
        structured, multivalued lists. approvedUsers/allowedAccountTypes/requiredProfileStatuses were
        added as new, distinct GovernanceMixin slots (with matching DUO:0000026 conditional-requirement
        rules) to close this gap without repurposing the free-text field."

  - dataUseModifier: DUO:0000020
    policyCardName: collaboration-required
    referenceValueKeys:
      - datasetID
    referenceValueSources:
      - referenceValueKey: datasetID
        sourceSlot: assetBindings
        sourceField: assetDid
        keyIsMultivalued: false
    requiredCredentials:
      - credentialType: TeamCredential
        requiredClaims: [MemberOfTeamOf]
      - credentialType: ProjectOwnershipCredential
        requiredClaims: [Owns]
      - credentialType: AffiliationCredential
        requiredClaims: [isMemberOf]
      - credentialType: ScopedAgreementCredential
        requiredClaims: [agreementInfo.scope.obligation, agreementInfo.scope.dataset, agreementInfo.scope.project]
      - credentialType: AgreementCredential
        requiredClaims: [agreementInfo.documentID]
      - credentialType: publicKeyCredential
        requiredClaims: [key]
    capabilityOperation: do_download
    notes:
      - "datasetID is the governed asset's own DID, not a value about collaboration itself — sourced from
        PolicyFabricMixin.assetBindings[].assetDid, not the existing collaborationRequired slot (which holds
        a PI email address, an entirely different piece of information)."
      - "The actual gating condition is a 5-credential chain (Team -> ProjectOwnership -> Affiliation ->
        ScopedAgreement -> Agreement); governanceDUO has no per-AccessRequirement representation of this
        chain today (out of scope for this pass — it is evidence the *requester* presents, not something the
        asset owner's record needs to carry)."

