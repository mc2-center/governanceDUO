id: https://w3id.org/sage-bionetworks/governance-duo/derivation_policy
name: governance_duo_derivation_policy
description: >-
  The Derivation Policy Graph (Layer 4 of plans/prov_o_integration.md) — explicitly
  NOT a PROV-O extension. Per the analysis this repo's plan formalizes: PROV-O
  gives you derivation ancestry, not propagation policy ("it doesn't decide
  propagation rules... that's a policy design question your team has to answer
  explicitly — PROV-O just gives you the edges to enforce whatever rule you pick").
  This file is this repo's own vocabulary, riding on top of the Provenance Graph
  (provenance.yaml) and Governance Graph (governance_graph.yaml) the same way
  Policy Fabric (policy_fabric.yaml) already rides on top of GovernanceMixin — a
  repo-local layer consuming ontology-backed data, not part of the ontology itself.
  See plans/prov_o_integration.md Section 4-5 for the full design, and Section 5
  specifically for why this does not overlap with Policy Fabric (Policy Fabric
  answers "did this one requester satisfy this one AR's condition" at request time;
  this file answers "should this derivation activity's combination of inputs have
  been allowed at all" at derivation time).

  `DerivationRule` is honestly ungrounded: no real Synapse or repo data source
  enumerates datatype/tier combination rules today — it ships as structural
  capability with illustrative examples only. Populated by governance/DCC policy
  owners as an explicit editorial act, never inferred.

  `ControlLabel`/`DerivationReview` moved to the graph layer
  (linkml/graph/governance.yaml, plans/model_refactor.md): they are graph
  content computed by scripts/build_derivation_policy.py from the canonical
  governance/provenance graph, not curated records, so this file no longer
  declares them. `DerivationRule` stays here, in the record layer -- it is
  curator configuration consumed by scripts/build_derivation_policy.py, not
  graph content. See plans/sagebrain_contract_and_owl_dl_fixes.md decision D6.
prefixes:
  governanceduo: https://w3id.org/sage-bionetworks/governance-duo/
  linkml: https://w3id.org/linkml/
default_prefix: governanceduo
default_range: string
imports:
  - linkml:types
  - base_entity
  - mixins
classes:
  DerivationRule:
    is_a: BaseEntity
    class_uri: governanceduo:DerivationRule
    description: >-
      A policy row keyed by a combination of DataTierEnum values, answering "may
      these tiers be joined/derived from together, and if so, what tier does the
      result carry?" — the note's own paragraph-21 combinatorial question "at a
      datatype/processing level." See this schema's own "Honest grounding note"
      above.
    slot_usage:
      id:
        description: A synthetic identifier for this rule.
        pattern: '^derivation_rule\.[A-Za-z0-9_-]+$'
        examples:
          - value: derivation_rule.controlled-plus-controlled
    slots:
      - inputDataTiers
      - permitted
      - resultingDataTier
      - requiresReview
      - rationale
slots:
  inputDataTiers:
    slot_uri: governanceduo:inputDataTiers
    description: The combination of input DataTier values this rule governs.
    range: DataTier
    multivalued: true
    required: true
  permitted:
    slot_uri: governanceduo:permitted
    description: Whether this combination of inputDataTiers may be joined/derived from together at all.
    range: boolean
    required: true
  resultingDataTier:
    slot_uri: governanceduo:resultingDataTier
    description: >-
      The DataTier the derived output carries when permitted. Defaults to
      max(inputDataTiers) per the note's own recommendation, but a rule may
      explicitly override it for a specific combination (e.g. an aggregation that
      demonstrably reduces sensitivity below its inputs' max). The override
      applies to what the output inherits: it never lowers the output below its
      own direct AccessRequirement bindings.
    range: DataTier
  requiresReview:
    slot_uri: governanceduo:requiresReview
    description: >-
      Whether this combination is only conditionally permitted, pending a human
      DerivationReview (a graph-layer record, linkml/graph/governance.yaml),
      rather than flatly permitted/denied.
    range: boolean
  rationale:
    slot_uri: governanceduo:rationale
    description: Free-text justification for this rule's permitted/resultingDataTier values.
