id: https://w3id.org/sage-bionetworks/governance-duo/access_requirement
name: governance_duo_access_requirement
description: LinkML representation of the AccessRequirement component.
prefixes:
  governanceduo: https://w3id.org/sage-bionetworks/governance-duo/
  linkml: https://w3id.org/linkml/
default_prefix: governanceduo
default_range: string
imports:
  - linkml:types
  - base_entity
  - mixins
  - props
classes:
  AccessRequirement:
    description: >-
      Representation of a Synapse Access Requirement and its relationships to
      entities, grants, and projects.
    is_a: BaseEntity
    mixins:
      - GovernanceMixin
      - ContributionMixin
      - PolicyFabricMixin
      - SynapseAccessRequirementMixin
    tree_root: true
    slot_usage:
      id:
        description: >-
          A unique identifier for the access requirement (schematic source attribute:
          AccessRequirement_id — the numeric Synapse access-requirement identifier).
        pattern: '^access_requirement\.\d+$'
        examples:
          - value: access_requirement.42
    slots:
      - StudyKey
      - entityIdList
slots:
  entityIdList:
    description: >-
      Synapse ID(s) for Synapse container(s) (e.g. Project, Dataset, Folder, Table,
      etc.) with which the Access Requirement is expected to be associated. Provide
      multiple values as a comma-separated list.
    multivalued: true
    pattern: '^syn\d+$'
