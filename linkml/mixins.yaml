id: https://w3id.org/sage-bionetworks/governance-duo/mixins
name: governance_duo_mixins
description: >-
  Cross-cutting concerns factored out as LinkML mixins, mirroring
  SageCommonDataModel's mixins.yaml (ProvenanceMixin pattern). Imports only
  linkml:types and props — never an entity file — to avoid import cycles.
  Enum permissible_value descriptions and DUO shorthand codes (annotations.duo_shorthand,
  e.g. GRU, HMB) are sourced from ../model/valid_values.csv, the repo's standalone
  controlled-vocabulary reference (not one of the four class model/*.model.csv files
  collated into sage-ar.model.csv, so it wasn't part of the earlier CSV rename).
prefixes:
  governanceduo: https://w3id.org/sage-bionetworks/governance-duo/
  linkml: https://w3id.org/linkml/
  DUO: http://purl.obolibrary.org/obo/DUO_
  MONDO: http://purl.obolibrary.org/obo/MONDO_
  ror: https://ror.org/
  prov: http://www.w3.org/ns/prov#
  NCIT: http://purl.obolibrary.org/obo/NCIT_
  T4FS: http://purl.obolibrary.org/obo/T4FS_
  ebiswo: http://www.ebi.ac.uk/swo/SWO_
  dcterms: http://purl.org/dc/terms/
default_prefix: governanceduo
default_range: string
imports:
  - linkml:types
  - props
slots:
  dataUseModifiers:
    description: >-
      A list of data use modifiers that apply to the access requirement. Includes
      real Data Use Ontology (DUO) terms plus Sage-local DUOPlus1-7 extensions (see
      README) and the literal value "Pending Annotation".
    multivalued: true
    range: DataUseModifierEnum
  collaborationRequired:
    description: >-
      If collaboration is required for the access requirement, provide the PI email
      address. Provide multiple as a comma-separated list.
    exact_mappings:
      - NCIT:C221739
    comments:
      - 'Required when dataUseModifiers contains DUO:0000020 — see GovernanceMixin rules.'
      - 'NCIT:C221739 "Consent for Use Requires Collaboration Agreement" carries the
        synonyms "COL"/"Collaboration required", the same shorthand this repo already
        uses for DUO:0000020 — verified live and non-obsolete via the OLS4 API.'
  diseaseSpecificResearch:
    description: >-
      The type(s) of disease research allowed by this access requirement. Provide the
      MONDO ID in format MONDO:id. Provide multiple values as a comma-separated list.
      MONDO terms can be found here: https://ols.monarchinitiative.org/ontologies/mondo
    multivalued: true
    pattern: 'MONDO:\d{7}'
    comments:
      - 'Required when dataUseModifiers contains DUO:0000007 — see GovernanceMixin rules.'
  geographicalRestriction:
    description: >-
      The specific geographic region(s) to which use is limited by the access
      requirement.
    multivalued: true
    range: GeographicalRegionEnum
    comments:
      - 'Required when dataUseModifiers contains DUO:0000022 — see GovernanceMixin rules.'
  institutionSpecificRestriction:
    description: >-
      Institutions with specific restrictions associated with the access requirement.
      Provide the institution ROR ID in format ROR:id. Provide multiple entries as a
      comma-separated list. ROR IDs can be found here: https://ror.org/search
    multivalued: true
    pattern: 'ROR:[a-z0-9]{9}'
    comments:
      - 'Required when dataUseModifiers contains DUO:0000028 — see GovernanceMixin rules.'
  institutionDids:
    description: >-
      Institutions with specific restrictions associated with the access requirement,
      as decentralized identifiers (DIDs) rather than ROR ids. Policy Fabric
      (https://github.com/hasan7n/tmp-policies)'s institution-specific-restriction
      policy_card expects its allowedInstitutions reference values, and the
      AffiliationCredential.isMemberOf claim it checks against them, to both be
      organization DIDs — not ROR ids. No standard ROR-to-DID resolution exists yet,
      so this is a separate, companion slot rather than a reinterpretation of
      institutionSpecificRestriction's existing pattern.
    multivalued: true
    pattern: '^did:[a-z0-9]+:.+$'
  publicationMoratorium:
    description: End date of the publication moratorium associated with the access requirement.
    comments:
      - 'schematic Format: date'
      - 'Required when dataUseModifiers contains DUO:0000024 — see GovernanceMixin rules.'
  researchSpecificRestrictions:
    description: Research-specific restrictions associated with the access requirement.
    comments:
      - 'Required when dataUseModifiers contains DUO:0000012 — see GovernanceMixin rules.'
  timeLimitOnUse:
    description: Time limit on the use of the data associated with the access requirement.
    range: float
    comments:
      - 'Required when dataUseModifiers contains DUO:0000025 — see GovernanceMixin rules.'
  userSpecificRestriction:
    description: The user-specific restrictions associated with the access requirement.
    comments:
      - 'Required when dataUseModifiers contains DUO:0000026 — see GovernanceMixin rules.'
  sourceGeography:
    description: >-
      The geographical source of the data associated with the access requirement.
      Equivalent to DUOPlus1.
    multivalued: true
    range: GeographicalRegionEnum
    comments:
      - 'Required when dataUseModifiers contains DUOPlus1 — see GovernanceMixin rules.'
  populationType:
    description: >-
      The population studied in the research associated with the access requirement.
      Equivalent to DUOPlus2.
    comments:
      - 'Required when dataUseModifiers contains DUOPlus2 — see GovernanceMixin rules.'
  deidentificationType:
    description: >-
      The type of de-identification applied to the data associated with the access
      requirement. Equivalent to DUOPlus3.
    multivalued: true
    range: DeidentificationTypeEnum
    close_mappings:
      - T4FS:0000414
    comments:
      - 'Required when dataUseModifiers contains DUOPlus3 — see GovernanceMixin rules.'
      - 'T4FS:0000414 "de-identification" (Terminology for Food Safety, but the term
        itself is a generic privacy concept) is a close, not exact, match — this slot
        names one of a specific set of methods (HIPPA_LDS/SafeHarbor/etc.), the OLS
        term describes the general technique.'
  dataPermission:
    description: >-
      The permissions associated with the data under the access requirement.
      Equivalent to DUOPlus4.
    multivalued: true
    range: DataPermissionEnum
    comments:
      - 'Required when dataUseModifiers contains DUOPlus4 — see GovernanceMixin rules.'
  dataTier:
    description: >-
      The tier of data access associated with the access requirement. Equivalent to
      DUOPlus5.
    multivalued: true
    range: DataTierEnum
    exact_mappings:
      - NCIT:C175887
    comments:
      - 'Required when dataUseModifiers contains DUOPlus5 — see GovernanceMixin rules.'
      - 'NCIT:C175887 "Open or Controlled Data Access Indicator" (synonym: "Data
        Access Level") is defined as "Specifies whether the data in a repository is
        open access or controlled access" — a direct match for this slot''s
        Anonymous/Open/Controlled/Private tiers.'
  license:
    description: >-
      The license under which the data associated with the access requirement is
      shared. Equivalent to DUOPlus6.
    multivalued: true
    range: LicenseEnum
    comments:
      - 'Required when dataUseModifiers contains DUOPlus6 — see GovernanceMixin rules.'
  attribution:
    description: The attribution statement for the data associated with the access requirement. Equivalent to DUOPlus7.
    close_mappings:
      - ebiswo:9000006
    comments:
      - 'Required when dataUseModifiers contains DUOPlus7 — see GovernanceMixin rules.'
      - 'SWO:9000006 "Attribution clause" (Software Ontology term, reused via the
        mcro ontology) — a license-clause-shaped close mapping; this slot instead
        holds the free-text statement itself, not the clause concept.'
  contributorName:
    description: The name of the person who added this access requirement.
    close_mappings:
      - prov:wasAttributedTo
    comments:
      - 'prov:wasAttributedTo relates a prov:Entity to a prov:Agent; this slot holds
        a literal name rather than an Agent reference, so the mapping is close, not
        exact.'
  contributionDate:
    description: The date on which the access requirement was added.
    close_mappings:
      - prov:generatedAtTime
    comments:
      - 'schematic Format: date'
      - 'prov:generatedAtTime ("The time at which an entity was completely created
        and is available for use") matches this slot''s semantics closely, treating
        the AccessRequirement record itself as the generated prov:Entity.'
  assetBindings:
    description: >-
      Policy Fabric Asset-registry DID(s), each paired with the Synapse entity id it
      registers. Replaces a pair of positionally order-aligned lists
      (dataUseModifiers-adjacent entityIdList and a since-removed flat assetDids list)
      with an explicit pairing, so which DID belongs to which Synapse entity is
      structural rather than convention-only. Each synapseId here should also appear
      in the containing record's entityIdList (documented, not schema-enforced).
      GovernanceMixin's own `rules:` are cross-slot too, but only in the simpler
      "value X on slot A requires slot B to be present" sense; this would need the
      harder kind -- a positional/arity correspondence between two multivalued lists
      -- which LinkML's `rules:` preconditions/postconditions don't express, so it's
      left as a documented, not enforced, invariant.
    multivalued: true
    inlined: true
    inlined_as_list: true
    range: AssetBinding
  synapseId:
    description: >-
      A Synapse entity id. Reused across contexts that reference one specific Synapse
      entity: an AssetBinding registering it as a Policy Fabric Asset (this file), or
      a DrsObjectMapping crosswalking it to a DRS DrsObject (drs_alignment.yaml).
    pattern: '^syn\d+$'
    required: true
  assetDid:
    description: The Policy Fabric Asset-registry DID for synapseId.
    pattern: '^did:[a-z0-9]+:.+$'
    required: true
  guardianDataSource:
    description: >-
      The data path/source configured for this asset's Guardian. Mirrors
      Asset.metadata.data_source, set by convention (not schema) in
      tmp-policies/tools/pdo_client at asset-setup time.
  guardianUrl:
    description: >-
      The deployed Guardian service URL for this asset. Mirrors
      Asset.metadata.guardian_url, set by the same asset-setup convention.
  policyContractDid:
    description: >-
      The DID of the deployed rego_policy_agent/rego_token contract pair once this
      AccessRequirement's selected DUO codes have been "exposed" as a policy in
      Policy Fabric. Mirrors Asset.metadata.policy_contract.
    pattern: '^did:[a-z0-9]+:.+$'
  trustedIssuerDids:
    description: >-
      DID(s) of the Verifiable Credential issuer(s) this AccessRequirement's owner
      trusts to attest the claims its selected DUO codes require (see
      policy_fabric_bindings.yaml's requiredCredentials per code). Unlike
      PolicyCardBinding.requiredCredentials (a static, per-DUO-code fact), this
      varies per AccessRequirement — different owners may trust different
      institutional VC issuers — so it lives here, not in the policy_fabric.yaml
      lookup schema.
    multivalued: true
    pattern: '^did:[a-z0-9]+:.+$'
  requiredAgreementDocumentId:
    description: >-
      DID of the terms/agreement document the requester must accept before this
      access requirement's data use modifiers are satisfied. Added to close a
      Policy Fabric (https://github.com/hasan7n/tmp-policies) gap: its
      general-research-use, publication-moratorium, return-to-database-or-resource,
      and time-limit-on-use policy_cards all key their Reference Values Schema on a
      single requiredDocumentID, which no existing slot held — publicationMoratorium
      and timeLimitOnUse hold a date/duration, not a document identifier, so this is
      a new, distinct slot rather than a reinterpretation of either.
    pattern: '^did:[a-z0-9]+:.+$'
    comments:
      - 'Required when dataUseModifiers contains DUO:0000042, DUO:0000024, DUO:0000029, or DUO:0000025 — see GovernanceMixin rules.'
  notAfter:
    description: >-
      ISO-8601 datetime after which use is no longer permitted. Added to close a
      Policy Fabric gap: time-limit-on-use's Reference Values Schema key notAfter is
      an absolute datetime, whereas the existing timeLimitOnUse slot holds a number
      of months — a different shape entirely, so this is a new, distinct slot.
    comments:
      - 'Required when dataUseModifiers contains DUO:0000025 — see GovernanceMixin rules.'
  allowedPurposes:
    description: >-
      Research purpose term(s) for which use is allowed. Added to close a Policy
      Fabric gap: genetic-studies-only, health-or-medical-or-biomedical-research,
      population-origins-or-ancestry-research-only, and research-specific-restrictions
      all key their Reference Values Schema on a multivalued allowedPurposes list;
      the existing researchSpecificRestrictions slot is free text and not
      multivalued, so this is a new, distinct slot rather than a reinterpretation of
      it (the two can coexist — one is a human-readable narrative, this one is the
      structured, machine-checkable list Policy Fabric's Rego logic actually reads).
    multivalued: true
    comments:
      - 'Required when dataUseModifiers contains DUO:0000016, DUO:0000006, DUO:0000011, or DUO:0000012 — see GovernanceMixin rules.'
  prohibitedPurposes:
    description: >-
      Research purpose term(s) for which use is explicitly disallowed. Added to
      close a Policy Fabric gap: health-or-medical-or-biomedical-research,
      no-general-methods-research, non-commercial-use-only,
      not-for-profit-non-commercial-use-only, and
      population-origins-or-ancestry-research-prohibited all key their Reference
      Values Schema on a multivalued prohibitedPurposes list, which no existing slot
      held.
    multivalued: true
    comments:
      - 'Required when dataUseModifiers contains DUO:0000006, DUO:0000015, DUO:0000046, DUO:0000018, or DUO:0000044 — see GovernanceMixin rules.'
  nonprofitLegalForms:
    description: >-
      Legal entity form(s) qualifying as not-for-profit, coded per ISO 20275:2017
      (Entity Legal Form Code List). Added to close a Policy Fabric gap:
      not-for-profit-organisation-use-only and not-for-profit-non-commercial-use-only
      both key their Reference Values Schema on a multivalued nonprofitLegalForms
      list, which no existing slot held.
    multivalued: true
    comments:
      - 'Required when dataUseModifiers contains DUO:0000045 or DUO:0000018 — see GovernanceMixin rules.'
  approvedProjects:
    description: >-
      DID(s) of project(s) approved to use the data under this access requirement.
      Added to close a Policy Fabric gap: project-specific-restriction keys its
      Reference Values Schema on a multivalued approvedProjects list of DIDs, which
      no existing slot held.
    multivalued: true
    pattern: '^did:[a-z0-9]+:.+$'
    comments:
      - 'Required when dataUseModifiers contains DUO:0000027 — see GovernanceMixin rules.'
  approvedUsers:
    description: >-
      Identifier(s) of specifically approved users. Added to close a Policy Fabric
      gap: user-specific-restriction keys part of its Reference Values Schema on a
      multivalued approvedUsers list, checked against UserPlatformCredential.userId
      — the existing userSpecificRestriction slot is free text describing the
      restriction, not a structured list of identifiers, so this is a new, distinct
      slot (userSpecificRestriction, allowedAccountTypes, and requiredProfileStatuses
      together cover the three separate keys this one policy_card's Reference Values
      Schema defines).
    multivalued: true
    comments:
      - 'Required when dataUseModifiers contains DUO:0000026 — see GovernanceMixin rules.'
  allowedAccountTypes:
    description: >-
      Account type(s) permitted to access the data (checked against
      UserPlatformCredential.accountType). Added to close the same
      user-specific-restriction gap as approvedUsers.
    multivalued: true
    comments:
      - 'Required when dataUseModifiers contains DUO:0000026 — see GovernanceMixin rules.'
  requiredProfileStatuses:
    description: >-
      Profile status value(s) a requester's account must have (checked against
      UserPlatformCredential.profileStatus). Added to close the same
      user-specific-restriction gap as approvedUsers.
    multivalued: true
    comments:
      - 'Required when dataUseModifiers contains DUO:0000026 — see GovernanceMixin rules.'
  name:
    description: >-
      A Synapse-native display name. Shared by SynapseAccessRequirementMixin
      (ACCESS_REQUIREMENT.NAME) and, via the transitive import chain
      governance_graph.yaml -> access_requirement.yaml -> mixins.yaml,
      SynapseEntity (NODE.NAME) in governance_graph.yaml — defined once here
      rather than in governance_graph.yaml itself, since mixins.yaml cannot import
      governance_graph.yaml back without creating a cycle
      (governance_graph.yaml already depends on mixins.yaml through
      access_requirement.yaml).
  etag:
    description: >-
      Entity tag for optimistic concurrency control (a 36-character UUID). Shared
      the same way as `name` above, by SynapseAccessRequirementMixin
      (ACCESS_REQUIREMENT.ETAG) and SynapseEntity/DataAccessSubmission
      (NODE.ETAG/DATA_ACCESS_SUBMISSION.ETAG) in governance_graph.yaml.
  createdBy:
    description: >-
      Synapse numeric user id of the record's creator. Shared the same way as
      `name` above. Distinct from ContributionMixin's contributorName, which is
      this repo's own free-text curator-provenance field, not Synapse's own
      numeric CREATED_BY column — both coexist on AccessRequirement without
      collision.
    range: integer
    exact_mappings:
      - dcterms:creator
    comments:
      - 'scripts/build_governance_graph.py emits this integer two different ways
        depending on which class it''s on: as an IRI reference to a gov:Principal
        node (gov:createdBy) on DataAccessSubmission -- since a submission''s creator
        can be looked up as a first-class Principal individual -- but as a plain
        literal (gov:createdByUserId, a distinct predicate, not gov:createdBy) on
        SynapseEntity, which has no corresponding Principal record to link to. This
        divergence is deliberate and documented in shapes/governance_graph.owl.ttl,
        not a schema/export mismatch to fix.'
  createdOn:
    description: >-
      When the record was created (epoch milliseconds in the source Synapse
      tables). Shared the same way as `name` above. Distinct from
      ContributionMixin's contributionDate for the same reason as createdBy above.
    range: integer
    exact_mappings:
      - dcterms:created
  currentRevNum:
    description: >-
      The current revision number of the record. Shared the same way as `name`
      above, by SynapseAccessRequirementMixin (ACCESS_REQUIREMENT.CURRENT_REV_NUM)
      and SynapseEntity (NODE.CURRENT_REV_NUM).
    range: integer
  accessType:
    description: >-
      The kind of access this Access Requirement governs (ACCESS_REQUIREMENT.ACCESS_TYPE).
      Range is the same AccessTypeEnum used by AccessGrant.permission in
      governance_graph.yaml — one real Synapse ACCESS_TYPE type backs both an
      ACL grant's permission and an Access Requirement's own governed access kind.
    range: AccessTypeEnum
  concreteType:
    description: >-
      Which kind of Access Requirement this is (ACCESS_REQUIREMENT.CONCRETE_TYPE).
      The real Synapse column stores the full Java class name (e.g.
      "org.sagebionetworks.repo.model.ManagedACTAccessRequirement"); this enum
      uses the short class name for readability.
    range: AccessRequirementConcreteTypeEnum
  isTwoFaRequired:
    description: Whether two-factor authentication is required (ACCESS_REQUIREMENT.IS_TWO_FA_REQUIRED).
    range: boolean
enums:
  AccessTypeEnum:
    description: >-
      Synapse's real ACCESS_TYPE values, verified live via rest-docs.synapse.org
      (not inferred from the "sagebrain governance graph ACL_AR data" CSVs alone,
      which only name a handful of these as examples in a free-text NOTES column).
      Shared by AccessGrant.permission (an ACL grant's permission —
      ACL_RESOURCE_ACCESS_TYPE.STRING_ELE) in governance_graph.yaml and this file's
      own accessType slot (ACCESS_REQUIREMENT.ACCESS_TYPE) — the same underlying
      Synapse type in both places.
    permissible_values:
      CREATE:
        description: Permission to create a new entity or resource.
      READ:
        description: Permission to read or view the entity or resource.
      UPDATE:
        description: Permission to modify or update the entity or resource.
      DELETE:
        description: Permission to delete the entity or resource.
      CHANGE_PERMISSIONS:
        description: Permission to change access permissions for the entity or resource.
      DOWNLOAD:
        description: Permission to download files or data from the entity or resource.
      UPLOAD:
        description: Deprecated; adding this to an ACL has no effect.
        annotations:
          deprecated: true
      PARTICIPATE:
        description: Permission to participate in activities related to the entity, such as discussions or challenges.
      SUBMIT:
        description: Permission to submit content or data to the entity or resource.
      READ_PRIVATE_SUBMISSION:
        description: Permission to read private submissions associated with the entity.
      UPDATE_SUBMISSION:
        description: Permission to update or modify a submission.
      DELETE_SUBMISSION:
        description: Permission to delete a submission.
      TEAM_MEMBERSHIP_UPDATE:
        description: Permission to update team membership, such as adding or removing members.
      SEND_MESSAGE:
        description: Permission to send messages related to the entity or resource.
      CHANGE_SETTINGS:
        description: Permission to change settings or configuration for the entity or resource.
      MODERATE:
        description: Permission to moderate content or activity related to the entity or resource.
      REVIEW_SUBMISSIONS:
        description: Enables reviewing submission groups (e.g., on Access Requirements) for specified objects.
      EXEMPTION_ELIGIBLE:
        description: Qualifies for exemption when granted on Access Requirement ACLs.
  AccessRequirementConcreteTypeEnum:
    description: >-
      Synapse's real AccessRequirement subclasses, verified via
      Sage-Bionetworks/Synapse-Repository-Services's AccessRequirementType.java
      (lib/jdomodels/.../org/sagebionetworks/repo/model/ar/AccessRequirementType.java).
      Permissible values use the short Java class name; the actual
      ACCESS_REQUIREMENT.CONCRETE_TYPE column stores the fully-qualified name
      (e.g. "org.sagebionetworks.repo.model.ManagedACTAccessRequirement").
    permissible_values:
      TermsOfUseAccessRequirement:
        description: Restricted by terms of use (AccessRequirementType.TOU).
      SelfSignAccessRequirement:
        description: Restricted by terms of use, self-signed (AccessRequirementType.SELF_SIGNED).
      ACTAccessRequirement:
        description: Controlled by the Access and Compliance Team (AccessRequirementType.ATC).
      ManagedACTAccessRequirement:
        description: >-
          Controlled by the Access and Compliance Team, with a managed data
          access submission workflow (AccessRequirementType.MANAGED_ATC) — the
          type backing DataAccessSubmission/DataAccessSubmissionStatus in
          governance_graph.yaml.
      LockAccessRequirement:
        description: Controlled by the Access and Compliance Team; locks an entity (AccessRequirementType.LOCK).
  DataUseModifierEnum:
    description: >-
      Data Use Ontology (DUO) modifier codes, plus Sage-local DUOPlus1-7 extensions
      (see README) and "Pending Annotation". Real DUO terms carry `meaning:` pointing
      at the actual obo:DUO_ IRI (reuse-by-IRI, not re-minting — the same convention
      sagebrain-model documents for its own external-term reuse).
    permissible_values:
      DUO:0000042:
        description: >-
          General Research Use - This data use permission indicates that use is allowed for general research use for any research purpose.
        meaning: DUO:0000042
        annotations:
          duo_shorthand: "GRU"
      DUO:0000027:
        description: >-
          Project Specific Restriction - This data use modifier indicates that use is limited to use within an approved project.
        meaning: DUO:0000027
        annotations:
          duo_shorthand: "PS"
      DUO:0000016:
        description: >-
          Geographical Restriction - This data use modifier indicates that use is limited to genetic studies only (i.e., studies that include genotype research alone or both genotype and phenotype research, but not phenotype research exclusively)
        meaning: DUO:0000016
        annotations:
          duo_shorthand: "GSO"
      DUO:0000029:
        description: >-
          Return to Database or Resource - This data use modifier indicates that the requestor must return derived/enriched data to the database/resource.
        meaning: DUO:0000029
        annotations:
          duo_shorthand: "RTN"
      DUO:0000043:
        description: >-
          Clinical Care Use - This data use modifier indicates that use is allowed for clinical use and care.
        meaning: DUO:0000043
        annotations:
          duo_shorthand: "CC"
      DUO:0000015:
        description: >-
          No General Methods Research - This data use modifier indicates that use does not allow methods development research (e.g., development of software or algorithms).
        meaning: DUO:0000015
        annotations:
          duo_shorthand: "NMDS"
      DUO:0000004:
        description: >-
          No Restriction - This data use permission indicates there is no restriction on use.
        meaning: DUO:0000004
        annotations:
          duo_shorthand: "NRES"
      DUO:0000045:
        description: >-
          Not-for-Profit Organisation Use Only - This data use modifier indicates that use of the data is limited to not-for-profit organizations.
        meaning: DUO:0000045
        annotations:
          duo_shorthand: "NPU"
      DUO:0000017:
        description: >-
          Data use modifiers indicate additional conditions for use.
        meaning: DUO:0000017
        annotations:
          duo_shorthand: "DUM"
      DUO:0000011:
        description: >-
          Population Origins or Ancestry Research Only - This data use permission indicates that use of the data is limited to the study of population origins or ancestry.
        meaning: DUO:0000011
        annotations:
          duo_shorthand: "POA"
      DUO:0000046:
        description: >-
          Non-Commercial Use Only - This data use modifier indicates that use of the data is limited to not-for-profit use.
        meaning: DUO:0000046
        annotations:
          duo_shorthand: "NCU"
      DUO:0000018:
        description: >-
          Not-for-Profit, Non-Commercial Use Only - This data use modifier indicates that use of the data is limited to not-for-profit organizations and not-for-profit use, non-commercial use.
        meaning: DUO:0000018
        annotations:
          duo_shorthand: "NPUNCU"
      DUO:0000044:
        description: >-
          Population Origins or Ancestry Research Prohibited - This data use modifier indicates use for purposes of population, origin, or ancestry research is prohibited.
        meaning: DUO:0000044
        annotations:
          duo_shorthand: "NPOA"
      DUO:0000021:
        description: >-
          Ethics Approval Required - This data use modifier indicates that the requestor must provide documentation of local IRB/ERB approval.
        meaning: DUO:0000021
        annotations:
          duo_shorthand: "IRB"
      DUO:0000006:
        description: >-
          Health or Medical or Biomedical Research - This data use permission indicates that use is allowed for health/medical/biomedical purposes; does not include the study of population origins or ancestry.
        meaning: DUO:0000006
        annotations:
          duo_shorthand: "HMB"
      DUO:0000019:
        description: >-
          Publication Required - This data use modifier indicates that requestor agrees to make results of studies using the data available to the larger scientific community.
        meaning: DUO:0000019
        annotations:
          duo_shorthand: "PUB"
      DUO:0000026:
        description: >-
          User Specific Restriction - This data use modifier indicates that use is
          limited to use by approved users. If providing this term, please describe
          the restrictions in column userSpecificRestriction.
        meaning: DUO:0000026
        annotations:
          duo_shorthand: "US"
      DUO:0000020:
        description: >-
          Collaboration Required - This data use modifier indicates that the
          requestor must agree to collaboration with the primary study
          investigator(s). If providing this term, please note the contact email in
          column collaborationRequired.
        meaning: DUO:0000020
        annotations:
          duo_shorthand: "COL"
      DUO:0000012:
        description: >-
          Research Specific Restrictions - This data use modifier indicates that use
          is limited to studies of a certain research type. If providing this term,
          please note the research type(s) in column researchSpecificRestrictions.
        meaning: DUO:0000012
        annotations:
          duo_shorthand: "RS"
      DUO:0000025:
        description: >-
          Time Limit on Use - This data use modifier indicates that use is approved
          for a specific number of months. If providing this term, please provide the
          number of months in column timeLimitOnUse.
        meaning: DUO:0000025
        annotations:
          duo_shorthand: "TS"
      DUO:0000024:
        description: >-
          Publication Moratorium - This data use modifier indicates that requestor
          agrees not to publish results of studies until a specific date. If providing
          this term, please provide the date in column publicationMoratorium.
        meaning: DUO:0000024
        annotations:
          duo_shorthand: "MOR"
      DUO:0000028:
        description: >-
          Institution Specific Restriction - This data use modifier indicates that
          use is limited to use within an approved institution. If providing this
          term, please provide the institution ROR ID(s) in column
          institutionSpecificRestriction.
        meaning: DUO:0000028
        annotations:
          duo_shorthand: "IS"
      DUO:0000022:
        description: >-
          Geographical Restriction - This data use modifier indicates that use is
          limited to within a specific geographic region. If providing this term,
          please provide the applicable country code(s) in column
          geographicalRestriction.
        meaning: DUO:0000022
        annotations:
          duo_shorthand: "GS"
      DUO:0000007:
        description: >-
          Disease Specific Research - This data use permission indicates that use is
          allowed provided it is related to the specified disease. If providing this
          term, please provide the disease MONDO ID(s) in column
          diseaseSpecificResearch.
        meaning: DUO:0000007
        annotations:
          duo_shorthand: "DS"
      DUOPlus1:
        description: >-
          Source geography is relevant to governance decisions. If providing this
          term, please provide the applicable country code(s) in column
          sourceGeography.
        annotations:
          sage_extension: true
      DUOPlus2:
        description: >-
          Study population is relevant to governance decisions. If providing this
          term, please provide the applicable population type(s) in column
          populationType.
        annotations:
          sage_extension: true
      DUOPlus3:
        description: >-
          Data deidentification is relevant to governance decisions. If providing
          this term, please provide the applicable deidentification type(s) in
          column deidentificationType.
        annotations:
          sage_extension: true
      DUOPlus4:
        description: >-
          A data permission designation is associated with the Study. If providing
          this term, please provide the applicable permission type(s) in column
          dataPermission.
        annotations:
          sage_extension: true
      DUOPlus5:
        description: >-
          A data tier designation is associated with the Study. If providing this
          term, please provide the applicable data tier designation(s) in column
          dataTier.
        annotations:
          sage_extension: true
      DUOPlus6:
        description: >-
          A license is associated with the Study. If providing this term, please
          provide the applicable license in column license.
        annotations:
          sage_extension: true
      DUOPlus7:
        description: >-
          Attribution conditions are associated with this Study. If providing this
          term, please provide the attribution statement in column attribution.
        annotations:
          sage_extension: true
      Pending Annotation:
        description: The data use modifier for this record has not yet been annotated.
  DataPermissionEnum:
    permissible_values:
      Agreement:
        description: "Data use conditions are derived from a Data Use Agreement."
      Attestation:
        description: "Data use conditions are derived from an Attestation."
      Award:
        description: "Data use conditions are derived from an Award."
      Other:
        description: "Other permissions may apply to the data access."
  DataTierEnum:
    permissible_values:
      Anonymous:
        description: "Data can be viewed and downloaded anonymously by anyone on the internet."
      Open:
        description: "Users must have a Synapse account to download data."
      Controlled:
        description: "Users must have a Synapse account and satisfy access conditions to download data."
      Private:
        description: "Users must be provided access to data in Synapse by a project administrator."
  LicenseEnum:
    description: >-
      model/shared.model.csv's license Valid Values list Apache_2.0/GPL_3.0; the
      standalone CV reference model/valid_values.csv previously documented
      Apache_2/GPL_3 (no ".0"/"3.0" suffix) for the same two licenses -- that mismatch
      has been fixed (valid_values.csv now matches shared.model.csv's spelling, the
      attribute's actual schematic Valid Values).
    permissible_values:
      CC0:
        description: "Creative Commons Zero license, allowing for the free use of the data."
      CC_BY:
        description: "Creative Commons Attribution license, requiring attribution to the original source."
      CC_BY_NC:
        description: "Creative Commons Attribution-NonCommercial license, allowing for non-commercial use with attribution."
      CC_BY_ND:
        description: "Creative Commons Attribution-NoDerivatives license, allowing for redistribution with attribution but no modifications."
      CC_BY_SA:
        description: "Creative Commons Attribution-ShareAlike license, allowing for modifications with attribution and sharing under the same license."
      CC_BY_NC_ND:
        description: "Creative Commons Attribution-NonCommercial-NoDerivatives license, allowing for non-commercial use with attribution but no modifications."
      CC_BY_NC_SA:
        description: "Creative Commons Attribution-NonCommercial-ShareAlike license, allowing for non-commercial modifications with attribution and sharing under the same license."
      Apache_2.0:
        description: "Apache License 2.0, a permissive license allowing for use, modification, and distribution."
      MIT:
        description: "MIT License, a permissive license allowing for use, modification, and distribution."
      GPL_3.0:
        description: "GNU General Public License v3.0, a copyleft license requiring derivative works to be licensed under the same terms."
      BSD_3_Clause:
        description: "BSD 3-Clause License, a permissive license allowing for use, modification, and distribution with attribution."
