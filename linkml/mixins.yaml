  ContributionMixin:
    mixin: true
    description: >-
      Contribution/authorship tracking. Only AccessRequirement uses this today, but
      it is factored out here (rather than inlined) so any class that later needs the
      same fields reuses it instead of duplicating — mirroring SageCommonDataModel's
      practice of factoring cross-cutting concerns out of individual entity files
      even before a second consumer exists.
    slots:
      - contributorName
      - contributionDate
    slot_usage:
      contributorName:
        required: true
      contributionDate:
        required: true
  PolicyFabricMixin:
    mixin: true
    description: >-
      Fields needed to deploy an AccessRequirement's governed entities into Policy
      Fabric (https://github.com/hasan7n/tmp-policies) as a registered Asset with an
      exposed policy. All optional — a governanceDUO record can exist before, or
      without ever, being deployed into Policy Fabric. Applied only to
      AccessRequirement: it already carries entityIdList (the concrete Synapse
      containers governed) and dataUseModifiers (which DUO codes/policy_cards
      apply), making it the natural analog of Policy Fabric's Asset + exposed-policy
      pairing — see linkml/policy_fabric.yaml and policy_fabric_bindings.yaml for the
      per-DUO-code credential/reference-value crosswalk this pairs with.
    slots:
      - assetBindings
      - guardianDataSource
      - guardianUrl
      - policyContractDid
      - trustedIssuerDids
  AssetBinding:
    description: >-
      One (Synapse entity id -> Policy Fabric Asset DID) pairing. Mirrors the Django
      Asset model's `did` field (unique per Asset) in tmp-policies/tools/asset_registry.
      A plain string, not a typed `range: SynapseEntity`, for synapseId: importing
      governance_graph.yaml (where SynapseEntity is defined) into this leaf file would
      create the same import cycle base_entity.yaml/props.yaml/mixins.yaml are
      designed to avoid (governance_graph.yaml already depends on mixins.yaml
      transitively, through access_requirement.yaml).
    slots:
      - synapseId
      - assetDid
  SynapseAccessRequirementMixin:
    mixin: true
    description: >-
      The real Synapse-native ACCESS_REQUIREMENT row fields (verified against
      "sagebrain governance graph ACL_AR data - AR table schemas.csv" plus the
      live/source lookups documented on the shared slots and enums above),
      applied to AccessRequirement alongside GovernanceMixin (the DUO
      characterization of an AR's conditions) and ContributionMixin (this repo's
      own curator-provenance fields — distinct from Synapse's own createdBy/
      createdOn here, see those slots' descriptions). Part of aligning
      governanceDUO with the SageBrain Governance Graph design, where an
      AccessRequirement is a first-class graph entity with its own Synapse
      identity, not only a DUO-condition record.
    slots:
      - name
      - etag
      - currentRevNum
      - accessType
      - concreteType
      - isTwoFaRequired
      - createdBy
      - createdOn
