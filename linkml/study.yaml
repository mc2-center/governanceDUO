id: https://w3id.org/sage-bionetworks/governance-duo/study
name: governance_duo_study
description: LinkML representation of the Study component.
prefixes:
  governanceduo: https://w3id.org/sage-bionetworks/governance-duo/
  linkml: https://w3id.org/linkml/
  NCIT: http://purl.obolibrary.org/obo/NCIT_
  T4FS: http://purl.obolibrary.org/obo/T4FS_
  EVORAO: https://w3id.org/evorao/
default_prefix: governanceduo
default_range: string
imports:
  - linkml:types
  - base_entity
  - mixins
  - props
classes:
  Study:
    description: Studies associated with a grant.
    is_a: BaseEntity
    mixins:
      - GovernanceMixin
    tree_root: true
    slot_usage:
      id:
        description: >-
          A unique primary key that enables record updates using schematic
          (schematic source attribute: Study_id).
        pattern: '^study\.[A-Za-z0-9_-]+$'
        annotations:
          cde_id: '12960571'
    slots:
      - AccessRequirementKey
      - grantNumber
      - studyName
      - studyDescription
      - studyInvestigator
      - studyParticipantNumber
      - studySampleNumber
      - studyDeidentificationType
      - studyDeidentificationMethodDescription
      - studyDeidentificationMethodSoftware
      - studyDbgapAccessionId
      - studyIndexDate
      - studyProjectIdentifier
slots:
  grantNumber:
    description: The identifier associated with the award funding this study.
    multivalued: true
    exact_mappings:
      - EVORAO:grantNumber
    comments:
      - 'EVORAO:grantNumber, "A formal reference or agreement number assigned by the
        funding body" — verified live and non-obsolete via the OLS4 API.'
  studyName:
    description: Name of the study.
    required: true
    annotations:
      cde_id: '11459810'
  studyDescription:
    description: >-
      Description of the study, including the types of experimental assays, model
      systems, types of analysis, description of cohort, associated vulnerable
      populations, special categories of data, rare diseases, etc. Maps to DUOPlus2.
    required: true
    annotations:
      cde_id: '03444002'
  studyInvestigator:
    description: >-
      Investigator(s) associated with the project. Multiple names should be provided
      as a comma-separated list.
    required: true
    close_mappings:
      - NCIT:C19924
    comments:
      - 'NCIT:C19924 "Principal Investigator" — a role concept, not a name; this slot
        holds literal investigator name(s), so the mapping is close, not exact.'
  studyParticipantNumber:
    description: The number of participant instances associated with systematic investigation into a subject.
    required: true
    range: float
    annotations:
      cde_id: '11555662'
  studySampleNumber:
    description: The number of specimens associated with systematic investigation into a subject.
    required: true
    range: float
    annotations:
      cde_id: '11555663'
  studyDeidentificationType:
    description: General description of the de-identification method. Maps to DUOPlus3.
    multivalued: true
    range: DeidentificationTypeEnum
    close_mappings:
      - T4FS:0000414
    annotations:
      cde_id: '14576319'
    comments:
      - 'T4FS:0000414 "de-identification" — see GovernanceMixin.deidentificationType
        for the same close (not exact) mapping and rationale.'
  studyDeidentificationMethodDescription:
    description: >-
      Description of the process of removing potentially identifying data or data
      elements to render data into a form that does not identify individuals and
      where identification is not likely to take place.
  studyDeidentificationMethodSoftware:
    description: Software that was used to de-identify the data (if used).
  studyDbgapAccessionId:
    description: >-
      A stable unique alphanumeric identifier assigned to a study and any objects by
      the database of Genotypes and Phenotypes (dbGaP). Required for controlled
      access data being submitted to CDS/CRDC.
    exact_mappings:
      - NCIT:C173940
    annotations:
      cde_id: '11524544'
    comments:
      - 'NCIT:C173940 "dbGaP Accession Number" — its OLS definition text is word-for-
        word this slot''s description (the CSV description likely originates from
        this NCIT term already).'
  studyIndexDate:
    description: >-
      The reference event associated with timepoints in this study. One of Diagnosis
      Date, Enrollment Date, Collection Date, or Birth Date.
    multivalued: true
    range: StudyIndexDateEnum
  studyProjectIdentifier:
    description: The Synapse Project identifier (synID) with which this Study is related.
    multivalued: true
    pattern: '^syn\d+$'
enums:
  StudyIndexDateEnum:
    permissible_values:
      Diagnosis Date: {}
      Enrollment Date: {}
      Collection Date: {}
      Birth Date: {}
